  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Anti-flash: apply the saved theme before first paint — same
       technique as csr/weather/paparan/index.html. -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
    })();
  </script>

  <!-- 1. Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- ABSOLUTE path — the Vercel cleanUrls lesson: relative paths
       resolve one level too high on slash-less directory URLs -->
  <link rel="stylesheet" href="/csr/weather/style.css" />
</head>

<body>

  <div id="stage">
    <header class="top-bar">
      <div class="title-block">
        <h1 id="page-heading">Cuaca Pahang</h1>
        <button id="location-toggle" class="location-toggle-btn" type="button"
                aria-haspopup="true" aria-expanded="false" aria-controls="location-popover"
                aria-label="Tukar negeri / daerah">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M12 2C7.86 2 4.5 5.36 4.5 9.5c0 5.25 6.6 11.68 6.88 11.95a.9.9 0 0 0 1.24 0C12.9 21.18 19.5 14.75 19.5 9.5 19.5 5.36 16.14 2 12 2zm0 10.25a2.75 2.75 0 1 1 0-5.5 2.75 2.75 0 0 1 0 5.5z"/>
          </svg>

      </div>
    </header>

    <div id="test-mode-banner"></div>
    <div id="state-error-banner"></div>

    <main>
      <div id="map-panel" class="panel">
        <div id="map"></div>
        <div id="map-legend" class="legend-card">
          <div class="legend-title">Status Daerah</div>
          <div class="legend-row"><span class="legend-swatch" data-tier="biasa"></span>Biasa</div>
          <div class="legend-row"><span class="legend-swatch" data-tier="dipilih"></span>Dipilih</div>
          <div class="legend-row"><span class="legend-swatch" data-tier="amaran"></span>Ribut Petir / Hujan Lebat</div>

      <div class="right-col">

          <div class="forecast-head" id="forecast-head">
            <h2 id="forecast-district-name">Pilih daerah</h2><span>Ramalan Cuaca</span>
            <span class="forecast-warn-badge" id="forecast-warn-badge">

          </div>

                <div class="slot-name">Petang</div>
                <div class="slot-icon" id="slot-icon-petang">—</div>
                <div class="slot-text" id="slot-text-petang">—</div>
              </div>
              <div class="forecast-slot">
                <div class="slot-name">Malam</div>
                <div class="slot-icon" id="slot-icon-malam">—</div>
                <div class="slot-text" id="slot-text-malam">—</div>

            </div>

    <footer id="page-footer">
      <span id="footer-source">Sumber data: MET Malaysia / data.gov.my</span>

  </div>
  <!-- /#stage -->


  <!-- 2. Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Shared fetch/parse/severity logic (also used by paparan/'s own
       independent fork — see that file's header comment) —
       ABSOLUTE path, the Vercel cleanUrls lesson -->
  <script src="/csr/weather/weather-core.js"></script>

  <script>
    // Config, parsing, severity tiers and ?testWarning= fixtures all come
    // from /csr/weather/weather-core.js — this inline script is ONLY the
    // page rendering: Leaflet wiring, dropdowns, forecast/warning cards.
    //
    // Multi-state (2026-08-10): the state shown is resolved from ?state=
    // against data/states.json — see boot() at the bottom. `cfg` (the
    // active state's config entry) is a module-level global, set once by
    // boot() before anything else runs.
    //
    // Layout (2026-08-10): rebuilt to match csr/weather/paparan/'s visual
    // structure (header/top-bar, floating legend-card, forecast card,
    // two fixed tier-grouped warning cards) — see that page's own inline
    // script for the functions ported here almost verbatim. Kept
    // responsive (no fixed-canvas #stage) and the map is now LOCKED
    // (no drag/zoom/hover/click — matches paparan) since the state/
    // district selects are the only navigation this page needs; a
    // dropdown selection still programmatically pans/zooms the map via
    // fitBounds()/setView(), which works regardless of whether the
    // map's *user*-interaction handlers are enabled.
    //
    // `focusDistrict` (new) is the district the forecast card follows —
    // null until the viewer picks one from the district select (or it's
    // pre-set via ?district=), unlike paparan where it's permanently
    // fixed to Temerloh. `highlightByName()` is the single entry point
    // for "district selection changed": it drives both the map
    // highlight/zoom AND the forecast card, called from the select's
    // change handler and from the boot-time ?district= preselect.

    const FORECAST_REFRESH_MS = 60 * 60 * 1000; // daily-granularity data — hourly is plenty
    const TICK_MS = 60 * 1000;                  // relative-time labels + clock refresh

    let map, geojsonLayer;
    let cfg = null;                   // active state's config entry (from states.json)
    let STATE_CONFIG = null;          // all loaded states, keyed by states.json's own keys
    let isNationwide = false;         // true for the "malaysia" entry (cfg.stateCode === null)
    let focusDistrict = null;         // district the forecast card follows; null = placeholder
    let warningDistricts = new Map(); // district name → severity tier (single-state mode)
    let warningScope = null;          // null | 'district' | 'state' (single-state mode)
    let warningStateTier = null;      // tier for the whole-state wash, when scope === 'state' (single-state mode)
    let nationwideDistrictTiers = new Map(); // district name → severity tier (nationwide mode)
    let nationwideStateWash = new Map();     // stateCode → severity tier, vague state-wide warnings (nationwide mode)
    let activeWarnings = [];          // filtered, currently-active warning objects
    let lastCheckedAt = null;
    let forecastToday = null;         // today's row from the forecast API, once fetched

    // ?testWarning= override — full syntax documented in weather-core.js.
    // Param NAME matched case-insensitively — manually-typed URLs can end
    // up with "testwarning" (e.g. mobile/TV keyboards lowercasing it).
    const TEST_WARNING_PARAM = (function () {
      for (const [key, value] of new URLSearchParams(window.location.search)) {
        if (key.toLowerCase() === 'testwarning') return value;
      }
      return null;
    })();

    // ?raw — shows a debug overlay with the actual unprocessed API
    // responses. Ported from csr/weather/paparan/index.html. All-lowercase
    // (unlike ?testWarning=) so it can't be mistyped into a different case.
    const RAW_PARAM = new URLSearchParams(window.location.search).has('raw');

    function showStateBanner(msg) {
      const el = document.getElementById('state-error-banner');
      el.textContent = msg;
      el.classList.add('active');
    }

    // =========================================================
    // Theme toggle — localStorage['theme'] = 'dark'|'light', default
    // dark. Same technique as csr/weather/paparan/index.html: <html
    // data-theme> is already set pre-paint by the <head> script;
    // body.map-dark drives the Leaflet dark-tile filter (style.css).
    // =========================================================
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.body.classList.toggle('map-dark', theme === 'dark');
      document.getElementById('theme-toggle').textContent = theme === 'dark' ? 'Mod Terang' : 'Mod Gelap';
    }

    function initThemeToggle() {
      applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        applyTheme(next);
      });
    }

    // =========================================================
    // Location popover — Negeri/Daerah selects tucked behind a pin-icon
    // toggle in the title, anchored via .title-block { position: relative }
    // (see style.css). Only the show/hide chrome lives here; the selects'
    // own change handlers (populateStateSelect/populateDistrictSelect) are
    // unchanged and unaffected by where the markup physically sits.
    // =========================================================
    function initLocationPopover() {
      const btn = document.getElementById('location-toggle');
      const pop = document.getElementById('location-popover');

      function open() {
        pop.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
        document.getElementById('stateSelect').focus();
      }
      function close(opts) {
        const refocus = opts && opts.refocus;
        if (pop.hidden) return;
        pop.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
        if (refocus) btn.focus();
      }

      btn.addEventListener('click', () => pop.hidden ? open() : close());

      document.addEventListener('click', (e) => {
        if (pop.hidden) return;
        // btn.contains(), not e.target !== btn — a click on the icon
        // button's inner <svg>/<path> has THAT as e.target, not the
        // button itself, so a strict !== check closed the popover in
        // the same click that just opened it.
        if (!pop.contains(e.target) && !btn.contains(e.target)) close();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !pop.hidden) close({ refocus: true });
      });

      // Auto-close after a district pick — the map pan + forecast-card
      // update are the visible confirmation. The state select's own change
      // handler navigates the whole page away, so it doesn't need this.
      document.getElementById('districtSelect').addEventListener('change', () => close());
    }

    // =========================================================
    // Live clock + date
    // =========================================================
    function renderClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent =
        now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('live-date').textContent =
        now.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    // =========================================================
    // 1920x1080 fixed-canvas stage, uniformly scaled to fit whatever
    // screen this loads on — same mechanism as csr/weather/paparan/.
    // =========================================================
    function applyStageScale() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    // =========================================================
    // ?raw — debug overlay, fixed on top of #stage (not inside it, so it
    // isn't shrunk by applyStageScale()'s TV scale transform). Fetches the
    // real endpoints fresh and shows each response's actual text — not the
    // normalized objects fetchActiveWarnings()/fetchRainWarnings() return.
    // Ported from csr/weather/paparan/index.html, adapted for this page's
    // multi-state/nationwide config: the warning URL is built from the
    // active `cfg` via buildWarningApiUrl() (paparan hardcodes a single
    // Pahang URL instead), and the forecast source is only shown when a
    // district is actually resolvable — either already focused (a district
    // was picked before ?raw was opened) or given via ?district= in the
    // URL directly, since boot() may call this before the async GeoJSON
    // load has processed that preselect. Nationwide mode has no single
    // district to forecast, so that source is simply omitted there.
    // =========================================================
    function initRawDebugOverlay() {
      const overlay = document.createElement('div');
      overlay.className = 'raw-debug-overlay';
      overlay.innerHTML = '<h1>Data Mentah API (?raw)</h1>';
      document.body.appendChild(overlay);

      const sources = [
        ['Amaran Ribut Petir (warning)', buildWarningApiUrl(cfg)],
        ['Amaran Hujan Berterusan (rain proxy)', RAIN_PROXY_URL],
      ];

      const districtParam = new URLSearchParams(window.location.search).get('district');
      const forecastDistrict = focusDistrict ||
        (districtParam && cfg.districts.includes(districtParam) ? districtParam : null);
      if (forecastDistrict) {
        sources.unshift([
          `Ramalan Cuaca (forecast) — ${forecastDistrict}`,
          `https://api.data.gov.my/weather/forecast?contains=${encodeURIComponent(forecastDistrict)}@location__location_name`,
        ]);
      } else if (!isNationwide) {
        const note = document.createElement('div');
        note.className = 'raw-debug-note';
        note.textContent = 'Ramalan Cuaca tidak dipaparkan — belum ada daerah dipilih (guna ?district=).';
        overlay.appendChild(note);
      }

      sources.forEach(([label, url]) => {
        const section = document.createElement('section');
        section.className = 'raw-debug-section';
        section.innerHTML = `<h2>${escapeHtml(label)}</h2>` +
          `<div class="raw-debug-url">${escapeHtml(url)}</div>` +
          `<pre class="raw-debug-pre">Memuatkan…</pre>`;
        overlay.appendChild(section);
        const pre = section.querySelector('.raw-debug-pre');

        fetchWithTimeout(url, 8000)
          .then(res => res.text().then(text => ({ ok: res.ok, status: res.status, text })))
          .then(({ ok, status, text }) => {
            let body = text;
            try { body = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* not JSON — show raw text as-is */ }
            pre.textContent = (ok ? '' : `HTTP ${status}\n\n`) + body;
          })
          .catch(err => { pre.textContent = 'Gagal memuatkan: ' + err.message; });
      });
    }

    // =========================================================
    // Map — LOCKED: no drag/zoom/hover/click (matches paparan; a
    // dropdown selection still drives the view programmatically).
    // =========================================================
    // Grey (#8a8a8a) borders on every district regardless of warning
    // state — a local override so weather-core.js's shared defaultStyle
    // (also used elsewhere) never gets touched. Matches paparan's map
    // border styling exactly.
    const PAGE_DEFAULT_STYLE = { ...defaultStyle, color: '#8a8a8a' };

    function baseStyle(feature) {
      const name = feature.properties.name;

      if (isNationwide) {
        const tier = nationwideDistrictTiers.get(name);
        if (tier) return { ...districtWarningStyle(tier), color: '#8a8a8a', weight: 2 };
        // Vague "whole state, no district detail" wash — scoped to just
        // that state's own features via properties.state, since nationwide
        // mode renders every state at once (unlike single-state mode,
        // where a bare warningScope === 'state' flag was enough because
        // only one state's polygons were ever on screen).
        const wash = nationwideStateWash.get(feature.properties.state);
        if (wash) return { ...stateWarningStyle(wash), color: '#8a8a8a', weight: 2 };
        return PAGE_DEFAULT_STYLE;
      }

      const tier = warningDistricts.get(name);
      // District-specific tier paints on top even under a state-wide wash,
      // so "SEKSYEN A: <State> (Maran)" stays visible inside a vaguer
      // whole-state section from another bulletin.
      if (tier) return { ...districtWarningStyle(tier), color: '#8a8a8a', weight: 2 };
      if (warningScope === 'state') return { ...stateWarningStyle(warningStateTier), color: '#8a8a8a', weight: 2 };
      return PAGE_DEFAULT_STYLE;
    }

    // Dropdown "jump to district" selection — an outline-only override on
    // top of whatever fill baseStyle() would give, so a selected district
    // that's also under an active warning still shows its warning color.
    function selectionStyle(feature) {
      const base = baseStyle(feature);
      return Object.assign({}, base, {
        weight: 4,
        color: '#1d4ed8',
        fillOpacity: Math.min(1, (base.fillOpacity || 0.6) + 0.1)
      });
    }

    function repaintMap() {
      if (geojsonLayer) geojsonLayer.setStyle(baseStyle);
    }

    // Resets the map to the active state's own framing — cfg.center/zoom
    // when hand-tuned (Pahang), else fitBounds to whatever districts are
    // actually loaded (any other state, until it gets its own tuned value).
    function resetMapView() {
      if (cfg.center && cfg.zoom != null) {
        map.setView(cfg.center, cfg.zoom);
      } else if (geojsonLayer) {
        map.fitBounds(geojsonLayer.getBounds());
      }
    }

    // One label per state (nationwide mode only) — groups the already-
    // rendered district layers by feature.properties.state and places a
    // single tooltip at the combined bounds' center of each group, instead
    // of a per-district label for every district in the country at once.
    function addStateLabels() {
      const stateNameByCode = {};
      Object.values(STATE_CONFIG).forEach(s => {
        if (s.stateCode) stateNameByCode[s.stateCode] = s.displayName;
      });

      const layersByState = new Map();
      geojsonLayer.eachLayer(layer => {
        const code = layer.feature.properties.state;
        if (!layersByState.has(code)) layersByState.set(code, []);
        layersByState.get(code).push(layer);
      });

      layersByState.forEach((layers, code) => {
        const center = L.featureGroup(layers).getBounds().getCenter();
        L.tooltip({ permanent: true, direction: 'center', className: 'state-label-pill' })
          .setLatLng(center)
          .setContent(stateNameByCode[code] || code)
          .addTo(map);
      });
    }

    function loadGeoJSON() {
      fetchWithTimeout(GEOJSON_URL, 8000)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          const stateData = {
            type: "FeatureCollection",
            features: isNationwide ? data.features : data.features.filter(f => f.properties.state === cfg.stateCode)
          };

          geojsonLayer = L.geoJSON(stateData, {
            style: baseStyle,
            onEachFeature: (feature, layer) => {
              // Nationwide mode shows one label per STATE instead (see
              // addStateLabels() below) — a per-district label for every
              // district in the country at once is unreadable clutter.
              if (isNationwide) return;
              layer.bindTooltip(feature.properties.name, {
                permanent: true, direction: 'center', className: 'district-label-pill'
              });
            }
          }).addTo(map);

          if (isNationwide) addStateLabels();

          resetMapView();
          refreshWarnings(); // initial load — map is already visible by now

          const preselect = new URLSearchParams(window.location.search).get('district');
          if (preselect && cfg.districts.includes(preselect)) {
            document.getElementById('districtSelect').value = preselect;
            highlightByName(preselect);
          }
        })
        .catch(err => {
          console.warn('[weather] Failed to load district map:', err.message);
          const mapDiv = document.getElementById('map');
          mapDiv.classList.add('map-error');
          mapDiv.textContent = 'Peta tidak dapat dimuatkan. Sila cuba muat semula halaman.';
        });
    }

    /**
     * Single entry point for "district selection changed" — drives both
     * the map highlight/zoom and the forecast card. Called from the
     * district select's change handler and the boot-time ?district=
     * preselect.
     */
    function highlightByName(name) {
      focusDistrict = name || null;
      forecastToday = null;
      renderForecast(); // placeholder / new name immediately, no stale data flash
      if (focusDistrict) refreshForecast();

      if (!name) {
        repaintMap();
        resetMapView();
        return;
      }

      geojsonLayer.eachLayer(function (layer) {
        if (layer.feature.properties.name === name) {
          layer.setStyle(selectionStyle(layer.feature));
          layer.bringToFront();
          map.fitBounds(layer.getBounds(), { padding: [20, 20] });
        } else {
          geojsonLayer.resetStyle(layer);
        }
      });
    }

    // Populates #districtSelect from cfg.districts — replaces whatever
    // was there for the previously-active state (or the empty placeholder
    // on first boot). Only ever runs once per page load (choosing a
    // different state navigates via location.search, see
    // populateStateSelect()), so the change listener added here can't
    // end up double-bound.
    function populateDistrictSelect() {
      const sel = document.getElementById('districtSelect');
      sel.innerHTML = '<option value="">-- Pilih Daerah --</option>' +
        cfg.districts.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
      // Nationwide mode (cfg.districts === []) has no single district to
      // jump to — disable rather than leave an active-looking select with
      // only the placeholder option.
      sel.disabled = cfg.districts.length === 0;
      sel.addEventListener('change', () => highlightByName(sel.value));
    }

    // Populates #stateSelect from STATE_CONFIG once, at boot. Choosing a
    // state navigates (full reload) rather than swapping data in place —
    // simplest way to fully reset map/geojson/dropdown state, matching
    // this page's existing non-SPA style.
    function populateStateSelect(activeKey) {
      const sel = document.getElementById('stateSelect');
      sel.innerHTML = Object.entries(STATE_CONFIG)
        .map(([key, s]) => `<option value="${escapeHtml(key)}"${key === activeKey ? ' selected' : ''}>${escapeHtml(s.displayName)}</option>`)
        .join('');
      sel.addEventListener('change', () => {
        const params = new URLSearchParams(window.location.search);
        params.set('state', sel.value);
        params.delete('district'); // districts don't carry over between states
        window.location.search = params.toString();
      });
    }

    // =========================================================
    // Warning cards — two FIXED cards, one per source (ported from
    // csr/weather/paparan/index.html's identical functions).
    // =========================================================
    function newestFirst(list) {
      return list.slice().sort((a, b) =>
        new Date(b.warning_issue?.issued || 0) - new Date(a.warning_issue?.issued || 0));
    }

    // 'amaran' (thunderstorm/rain-lebat, untiered) reads as "Ribut Petir /
    // Hujan Lebat" in the UI, matching the card title and legend — the
    // raw TIER_LABEL value ("Amaran") is too generic on its own here.
    function tierRowLabel(tier) {
      return tier === 'amaran' ? 'Ribut Petir / Hujan Lebat' : (TIER_LABEL[tier] || tier);
    }

    function relPast(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      const mins = Math.floor((Date.now() - d.getTime()) / 60000);
      if (mins < 1) return 'Sebentar tadi';
      if (mins < 60) return `${mins} minit lepas`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? `${h} jam ${m} minit lepas` : `${h} jam lepas`;
    }

    function relFuture(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      const mins = Math.floor((d.getTime() - Date.now()) / 60000);
      if (mins < 0) return 'Tamat tempoh';
      if (mins < 1) return 'Kurang 1 minit lagi';
      if (mins < 60) return `${mins} minit lagi`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? `${h} jam ${m} minit lagi` : `${h} jam lagi`;
    }

    function formatTimeShort(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function renderWarnCard(el, title, items, marineCount) {
      if (!items.length) {
        el.className = 'warn-card empty panel';
        el.style.borderLeftColor = 'transparent';
        el.innerHTML = `
          <div class="warn-card-head"><h2>Tiada ${escapeHtml(title)}</h2></div>
          ${marineCount ? `<div class="warn-marine-note">🌊 Amaran perairan ${escapeHtml(cfg.displayName)} sahaja aktif (bukan kawasan darat)</div>` : ''}`;
        return;
      }

      const w = items[0];
      const parsed = stateScopeOf(w, cfg);
      // Highest tier among this warning's districts drives the accent colour.
      let accentTier = parsed.tier || 'amaran';
      Object.values(parsed.tiers || {}).forEach(t => {
        if (TIER_RANK[t] > TIER_RANK[accentTier]) accentTier = t;
      });

      // One pill per district, coloured by its severity tier — the
      // bulletin's full text is deliberately NOT shown: MET publishes one
      // nationwide bulletin listing every state, which is noise here.
      const pill = (label, tier) => {
        const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
        const textColor = tier === 'waspada' ? '#713f12' : '#ffffff';
        return `<span class="warn-pill" style="background:${c.fill};color:${textColor}">${escapeHtml(label)}</span>`;
      };

      // Group districts by tier so each severity gets its own row — MET's
      // bulletins only ever carry ONE valid_to per bulletin, so every row
      // below intentionally reuses the same warning-level "sehingga" value.
      let rowsHtml = '';
      if (parsed.scope !== 'marine') {
        const groups = new Map(); // tier -> [district label, ...]
        if (parsed.scope === 'state') {
          groups.set(accentTier, [`Seluruh ${cfg.displayName}`]);
        } else {
          parsed.districts.forEach(d => {
            const t = (parsed.tiers && parsed.tiers[d]) || 'amaran';
            if (!groups.has(t)) groups.set(t, []);
            groups.get(t).push(d);
          });
        }
        const tiersSorted = [...groups.keys()].sort((a, b) => TIER_RANK[b] - TIER_RANK[a]);
        const sehinggaShort = w.valid_to ? (formatTimeShort(w.valid_to) || '—') : '—';
        const sehinggaRel = w.valid_to ? (relFuture(w.valid_to) || '') : '';
        rowsHtml = tiersSorted.map(tier => {
          const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
          const districtsHtml = groups.get(tier).slice().sort((a, b) => a.localeCompare(b))
            .map(d => pill(d, tier)).join('');
          return `
            <div class="warn-card-tier-row">
              <div class="tier-row-head">
                <span class="tier-swatch" style="background:${c.fill}"></span>
                <span class="tier-label">${escapeHtml(tierRowLabel(tier))}</span>
                <span class="tier-sehingga">sehingga ${escapeHtml(sehinggaShort)}${sehinggaRel ? ` · <span class="rel-chip">${escapeHtml(sehinggaRel)}</span>` : ''}</span>
              </div>
              <div class="tier-row-districts">${districtsHtml}</div>
            </div>`;
        }).join('');
      }

      const issued = w.warning_issue?.issued;
      const issuedShort = issued ? (formatTimeShort(issued) || '—') : '—';
      const issuedRel = issued ? (relPast(issued) || '') : '';
      const more = items.length > 1 ? `+${items.length - 1} lagi` : '';

      el.className = 'warn-card active panel' + (accentTier === 'bahaya' ? ' tier-bahaya-active' : '');
      el.style.borderLeftColor = (TIER_COLORS[accentTier] || TIER_COLORS.amaran).fill;
      el.innerHTML = `
        <div class="warn-card-head">
          ${accentTier === 'bahaya' ? '<span class="pulse-dot"></span>' : ''}
          <h2>${escapeHtml(title)}</h2>
          ${more ? `<span class="warn-more">${escapeHtml(more)}</span>` : ''}
          <span class="meta-issued">Dikeluarkan ${escapeHtml(issuedShort)}${issuedRel ? ` · <span class="rel-chip">${escapeHtml(issuedRel)}</span>` : ''}</span>
        </div>
        ${rowsHtml}
        ${(marineCount || parsed.scope === 'marine') ? `<div class="warn-marine-note">🌊 Amaran perairan ${escapeHtml(cfg.displayName)} aktif (bukan kawasan darat)</div>` : ''}`;
    }

    function renderCards() {
      const thunderCard = document.getElementById('card-thunder');
      const rainCard = document.getElementById('card-rain');

      // Nationwide mode has no single cfg to scope stateScopeOf()/pill
      // wording against (cfg.apiName is null — calling into it here would
      // throw) — the coloured map already communicates where warnings are;
      // the two per-state text cards stay hidden until a real state is
      // picked from the Negeri select.
      if (isNationwide) {
        thunderCard.hidden = true;
        rainCard.hidden = true;
        return;
      }
      thunderCard.hidden = false;
      rainCard.hidden = false;

      const rain = newestFirst(activeWarnings.filter(w => w.source === 'rain'));
      const others = newestFirst(activeWarnings.filter(w => w.source !== 'rain'));
      const land = others.filter(w => stateScopeOf(w, cfg).scope !== 'marine');
      const marineCount = others.length - land.length;

      renderWarnCard(thunderCard, 'Ribut Petir / Hujan Lebat', land, marineCount);
      renderWarnCard(rainCard, 'Amaran Hujan Berterusan', rain, 0);
    }

    function updateFooter() {
      const timeText = lastCheckedAt
        ? lastCheckedAt.toLocaleString('ms-MY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
        : '—';
      document.getElementById('footer-updated').textContent =
        `Dikemaskini ${timeText} · Auto setiap 3 minit`;
    }

    // Nationwide mode: one thunderstorm fetch (buildWarningApiUrl omits
    // contains= when cfg.apiName is null, see weather-core.js) + one rain
    // fetch (fetchRainWarningsRaw — the proxy was already unfiltered),
    // aggregated across all 16 states in memory by
    // computeWarningStateNationwide(). Same request count as single-state
    // mode — see the conversation that settled on this approach instead of
    // looping fetchActiveWarnings() once per state. ?testWarning= fixtures
    // are single-cfg only (getTestWarningFixture needs a real cfg.apiName)
    // and are simply ignored here — ?raw/live data is used instead.
    async function refreshWarningsNationwide() {
      const [thunder, rain] = await Promise.allSettled([
        fetchActiveWarnings(cfg),
        fetchRainWarningsRaw(),
      ]);

      if (thunder.status === 'rejected' && rain.status === 'rejected') {
        console.warn('[weather] Both warning sources failed:', thunder.reason?.message, rain.reason?.message);
      } else {
        if (thunder.status === 'rejected') console.warn('[weather] data.gov.my warnings failed:', thunder.reason?.message);
        if (rain.status === 'rejected') console.warn('[weather] rain proxy failed (expected under local static server):', rain.reason?.message);
        const combined = [
          ...(thunder.status === 'fulfilled' ? thunder.value : []),
          ...(rain.status === 'fulfilled' ? rain.value : []),
        ];
        const state = computeWarningStateNationwide(combined, STATE_CONFIG);
        nationwideDistrictTiers = state.districts;
        nationwideStateWash = state.stateWash;
      }
    }

    async function refreshWarnings() {
      lastCheckedAt = new Date();

      if (isNationwide) {
        await refreshWarningsNationwide();
        repaintMap();
        renderCards();
        applyForecastWarningAccent();
        updateFooter();
        return;
      }

      const fixture = getTestWarningFixture(TEST_WARNING_PARAM, cfg);
      if (fixture !== undefined) {
        activeWarnings = fixture.filter(isWarningActive);
        const state = computeWarningState(activeWarnings, cfg);
        warningScope = state.scope;
        warningDistricts = state.districts;
        warningStateTier = state.stateTier;
      } else {
        // Two independent sources, fetched in parallel — either failing
        // alone must not take down the other (rain proxy 404s under local
        // static servers by design; data.gov.my can have its own bad day).
        const [thunder, rain] = await Promise.allSettled([
          fetchActiveWarnings(cfg),
          fetchRainWarnings(cfg),
        ]);

        if (thunder.status === 'rejected' && rain.status === 'rejected') {
          console.warn('[weather] Both warning sources failed:', thunder.reason?.message, rain.reason?.message);
          // Leave the previously-known state on screen rather than clearing
          // it to a false "no warning" on a transient failure.
        } else {
          if (thunder.status === 'rejected') console.warn('[weather] data.gov.my warnings failed:', thunder.reason?.message);
          if (rain.status === 'rejected') console.warn('[weather] rain proxy failed (expected under local static server):', rain.reason?.message);
          activeWarnings = [
            ...(thunder.status === 'fulfilled' ? thunder.value : []),
            ...(rain.status === 'fulfilled' ? rain.value : []),
          ];
          const state = computeWarningState(activeWarnings, cfg);
          warningScope = state.scope;
          warningDistricts = state.districts;
          warningStateTier = state.stateTier;
        }
      }

      repaintMap();
      renderCards();
      applyForecastWarningAccent();
      updateFooter();
    }

    function initTestModeBanner() {
      if (!TEST_WARNING_PARAM) return;
      const el = document.getElementById('test-mode-banner');
      el.classList.add('active');
      el.textContent = `🧪 MOD UJIAN AKTIF — testWarning=${TEST_WARNING_PARAM} (data ujian, bukan amaran sebenar)`;
    }

    // =========================================================
    // Forecast (daily granularity — Pagi/Petang/Malam + min–maks),
    // ported from csr/weather/paparan/index.html — adapted to follow
    // `focusDistrict` (settable via the district select) instead of a
    // hardcoded district, via the same by-name MET lookup verified
    // during the multi-state work (contains=<name>@location__location_name).
    // =========================================================
    function localDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Finite set of Malay phrases from the API → icon. Unmapped phrases warn
    // instead of silently showing the wrong sky. 'berangin' (windy) has no
    // matching symbol in the sprite, so it still falls back to an emoji.
    // Ported from csr/weather/paparan/index.html's forecastIcon() for visual
    // parity — see this file's <svg><defs> sprite near the top of <body>.
    function forecastIcon(phrase, slot) {
      const p = (phrase || '').toLowerCase();
      if (!p) return '—';

      const svg = (inner) => `<svg class="wicon" viewBox="0 0 100 100">${inner}</svg>`;

      if (p.includes('ribut petir')) {
        return svg(
          '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
          '<use href="#wicon-gray-cloud" x="25" y="10" class="w-cloud-float-reverse" fill="url(#gradDarkGray)"/>' +
          '<use href="#wicon-thunder-bolt" x="30" y="61" class="w-lighting"/>' +
          '<use href="#wicon-white-cloud" x="7"/>' +
          '<use href="#wicon-thunder-bolt" x="45" y="56" class="w-lighting w-delay-1"/>'
        );
      }

      if (p.includes('tiada hujan')) {
        return slot === 'malam'
          ? svg(
            '<use href="#wicon-moon" x="-15"/>' +
            '<use href="#wicon-star" x="42" y="30" class="w-star"/>' +
            '<use href="#wicon-star" x="61" y="32" class="w-star w-delay-1"/>' +
            '<use href="#wicon-star" x="55" y="50" class="w-star w-delay-2"/>'
          )
          : svg('<use href="#wicon-sun"/>');
      }

      if (p.includes('hujan')) {
        if (p.includes('beberapa') || p.includes('satu dua')) {
          return slot === 'malam'
            ? svg(
              '<use href="#wicon-moon" x="-20" y="-15"/>' +
              '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
              '<use href="#wicon-rain-drop" x="25" y="65" class="w-drop1"/>' +
              '<use href="#wicon-rain-drop" x="45" y="65" class="w-drop3"/>' +
              '<use href="#wicon-white-cloud" x="7"/>'
            )
            : svg(
              '<use href="#wicon-sun" x="-12" y="-18"/>' +
              '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
              '<use href="#wicon-rain-drop" x="25" y="65" class="w-drop1"/>' +
              '<use href="#wicon-rain-drop" x="45" y="65" class="w-drop3"/>' +
              '<use href="#wicon-white-cloud" x="7"/>'
            );
        }
        return svg(
          '<use href="#wicon-gray-cloud" x="25" y="10" class="w-cloud-float-reverse" fill="url(#gradDarkGray)"/>' +
          '<use href="#wicon-rain-drop" x="15" y="65" class="w-drop4"/>' +
          '<use href="#wicon-rain-drop" x="25" y="65" class="w-drop1"/>' +
          '<use href="#wicon-rain-drop" x="37" y="65" class="w-drop2"/>' +
          '<use href="#wicon-rain-drop" x="50" y="65" class="w-drop3"/>' +
          '<use href="#wicon-white-cloud" x="5" y="-7"/>'
        );
      }

      if (p.includes('jerebu')) {
        return svg(
          '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradDarkGray)" x="0" y="20"/>' +
          '<use href="#wicon-gray-cloud" x="30" y="30" class="w-cloud-float-reverse" fill="url(#gradGray)"/>' +
          '<use href="#wicon-mist" x="0" y="30" class="w-mist"/>'
        );
      }

      if (p.includes('berangin')) return '💨';

      if (p.includes('berawan') || p.includes('mendung')) {
        return svg(
          '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
          '<use href="#wicon-white-cloud" x="7"/>'
        );
      }

      console.warn('[weather] Unmapped forecast phrase:', phrase);
      return svg(
        '<use href="#wicon-sun" x="-12" y="-18"/>' +
        '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
        '<use href="#wicon-white-cloud" x="7"/>'
      );
    }

    function tierWash(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyForecastWarningAccent() {
      const tier = focusDistrict
        ? (warningDistricts.get(focusDistrict) || (warningScope === 'state' ? warningStateTier : null))
        : null;

      const head = document.getElementById('forecast-head');
      const badge = document.getElementById('forecast-warn-badge');

      if (tier) {
        const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
        head.style.borderColor = c.fill;
        head.style.backgroundColor = tierWash(c.fill, 0.18);
        badge.querySelector('.tier-swatch').style.background = c.fill;
        badge.querySelector('.tier-label').textContent = tierRowLabel(tier);
        badge.classList.add('active');
      } else {
        head.style.borderColor = 'transparent';
        head.style.backgroundColor = 'transparent';
        badge.classList.remove('active');
      }
    }

    function renderForecast() {
      const card = document.getElementById('forecast-card');

      // No district picked yet — hide the whole card rather than showing
      // it full of "—" placeholders. card starts `hidden` in the markup
      // too, so there's no flash of an empty card before this runs.
      if (!focusDistrict) {
        card.hidden = true;
        return;
      }
      card.hidden = false;

      applyForecastWarningAccent();
      document.getElementById('forecast-district-name').textContent = focusDistrict;

      if (!forecastToday) {
        // District just picked, first fetch hasn't landed yet — keep "—"
        // placeholders (never show stale data from a prior district).
        document.getElementById('forecast-temp').textContent = '—';
        ['pagi', 'petang', 'malam'].forEach(slot => {
          document.getElementById(`slot-icon-${slot}`).textContent = '—';
          document.getElementById(`slot-text-${slot}`).textContent = '—';
        });
        return;
      }

      const f = forecastToday;
      document.getElementById('forecast-temp').textContent =
        (f.min_temp != null && f.max_temp != null) ? `${f.min_temp}° – ${f.max_temp}°` : '—';
      [['pagi', f.morning_forecast], ['petang', f.afternoon_forecast], ['malam', f.night_forecast]]
        .forEach(([slot, phrase]) => {
          document.getElementById(`slot-icon-${slot}`).innerHTML = forecastIcon(phrase, slot);
          document.getElementById(`slot-text-${slot}`).textContent = phrase || '—';
        });
    }

    async function refreshForecast() {
      if (!focusDistrict) { renderForecast(); return; }
      try {
        const url = `https://api.data.gov.my/weather/forecast?contains=${encodeURIComponent(focusDistrict)}@location__location_name`;
        const resp = await fetchWithTimeout(url, 8000);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const rows = await resp.json();
        // API sorts date-DESCENDING — limit= would return the FURTHEST
        // days, so fetch all and pick today explicitly.
        const today = localDateStr(new Date());
        const row = (Array.isArray(rows) ? rows : []).find(r => r.date === today);
        if (row) forecastToday = row;
        renderForecast();
      } catch (e) {
        // Keep last-known forecast on screen; placeholders only before
        // the first-ever success for this district.
        console.warn('[weather] Forecast fetch failed:', e.message);
      }
    }

    // =========================================================
    // Boot + refresh loop
    // =========================================================
    async function boot() {
      // Runs unconditionally, before the states.json fetch below — without
      // this, a fetch failure would leave #stage un-scaled/mispositioned
      // (top:50%/left:50% with no transform) and the error banner itself
      // would be invisible. Matches paparan's own unconditional placement.
      applyStageScale();
      window.addEventListener('load', applyStageScale);
      window.addEventListener('resize', applyStageScale);

      try {
        STATE_CONFIG = await loadStateConfig();
      } catch (e) {
        console.warn('[weather] Failed to load states.json:', e.message);
        showStateBanner('Gagal memuatkan konfigurasi negeri (states.json). Sila cuba muat semula halaman.');
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const stateKey = (params.get('state') || 'pahang').toLowerCase();
      cfg = STATE_CONFIG[stateKey];
      if (!cfg) {
        showStateBanner(`Negeri tidak dikenali: "${params.get('state')}" — kembali ke Pahang.`);
        cfg = STATE_CONFIG['pahang'] || Object.values(STATE_CONFIG)[0];
      }
      isNationwide = !cfg.stateCode;

      document.title = `Cuaca ${cfg.displayName} — Amaran & Peta Daerah`;
      document.getElementById('page-heading').textContent = `Cuaca ${cfg.displayName}`;

      populateStateSelect(stateKey in STATE_CONFIG ? stateKey : 'pahang');
      populateDistrictSelect();
      initLocationPopover();
      initThemeToggle();
      renderClock();
      renderForecast(); // hides the forecast card immediately (no district picked yet)
      renderCards();    // paint both empty warning-card states immediately, before first fetch

      // =========================================================
      // Initialize Map — LOCKED (no drag/zoom/hover/click; matches
      // paparan). The district select's fitBounds/setView calls still
      // work regardless of these interaction handlers being disabled.
      // =========================================================
      map = L.map('map', {
        zoomControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false,
        touchZoom: false,
        zoomSnap: 0, // no rounding — needed so cfg.zoom's fractional values (e.g. Pahang's 8.7, matching paparan) aren't snapped to an integer
      }).setView(cfg.center || [4.2105, 108.9758], cfg.zoom || 6); // provisional — resetMapView() (after GeoJSON loads) corrects this for auto-fit states

      // NOTE: hostname must be {s}.basemaps.cartocdn.com — an extra ".tile."
      // level breaks TLS (CARTO's wildcard cert covers one subdomain level
      // only), which silently killed the basemap with ERR_CERT_COMMON_NAME_INVALID.
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      }).addTo(map);

      initTestModeBanner();
      if (RAW_PARAM) initRawDebugOverlay();
      loadGeoJSON();

      // No point polling on an interval when serving a static fixture —
      // ?testWarning= is meant to be reloaded manually to test a new value.
      if (!TEST_WARNING_PARAM) {
        setInterval(() => {
          if (geojsonLayer) refreshWarnings();
        }, REFRESH_MS);

        // Throttled: rapid tab-switching must not burst requests at
        // data.gov.my (per-IP rate limit → HTTP 429). The 3-min interval
        // above still guarantees freshness.
        const VISIBILITY_MIN_GAP_MS = 60 * 1000;
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible' || !geojsonLayer) return;
          if (lastCheckedAt && (Date.now() - lastCheckedAt.getTime()) < VISIBILITY_MIN_GAP_MS) return;
          refreshWarnings();
        });
      }

      setInterval(() => { if (focusDistrict) refreshForecast(); }, FORECAST_REFRESH_MS);

      // Minute tick: keep "X minit lepas / lagi" honest and refresh the clock.
      setInterval(() => {
        renderCards();
        renderClock();
      }, TICK_MS);
    }

    boot();
  </script>

</body>

</html>
