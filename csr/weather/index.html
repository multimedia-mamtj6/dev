  <!-- Tailwind CSS Play CDN — matches root index.html's setup -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Archivo', 'Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Anti-flash: apply the saved theme before first paint — same
       technique as root index.html (classList-based, not data-theme). -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.replace('light', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- ABSOLUTE path — the Vercel cleanUrls lesson: relative paths
       resolve one level too high on slash-less directory URLs -->
  <link rel="stylesheet" href="/csr/weather/style.css" />
</head>

<body class="font-sans antialiased bg-zinc-50 dark:bg-zinc-950 text-zinc-950 dark:text-zinc-50">

  <!-- Shared fetch/parse/severity logic (also used by paparan/'s own
       independent fork — see that file's header comment) —
       ABSOLUTE path, the Vercel cleanUrls lesson -->
  <script src="/csr/weather/weather-core.js"></script>

  <script>
    // Config, parsing, severity tiers and ?testWarning= fixtures all come
    // from /csr/weather/weather-core.js — this inline script is ONLY the
    // page rendering: Leaflet wiring, dropdowns, forecast/warning cards.
    //
    // Redesign (2026-08-20): full-viewport interactive map (dropped the
    // fixed 1920x1080 kiosk #stage inherited from paparan/, switched the
    // CARTO basemap to its label-free tile variant — see initTileLayer()
    // — and rebuilt all chrome as floating Tailwind panels, matching root
    // index.html's dark/light convention instead of the old data-theme/
    // CSS-variable system). Map interaction (drag/zoom/scroll) is now
    // enabled — this is a real page, not a non-interactive kiosk.
    //
    // `focusDistrict` is the district the forecast card follows — null
    // until the viewer picks one from the district select (or it's
    // pre-set via ?district=). `highlightByName()` is the single entry
    // point for "district selection changed": it drives both the map
    // highlight/zoom AND the forecast card.

    const FORECAST_REFRESH_MS = 60 * 60 * 1000; // daily-granularity data — hourly is plenty
    const TICK_MS = 60 * 1000;                  // relative-time labels + clock refresh

    let map, geojsonLayer, tileLayer, stateBoundaryLayer;
    let cfg = null;                   // active state's config entry (from states.json)
    let STATE_CONFIG = null;          // all loaded states, keyed by states.json's own keys
    let isNationwide = false;         // true for the "malaysia" entry (cfg.stateCode === null)
    let focusDistrict = null;         // district the forecast card follows; null = placeholder
    let warningDistricts = new Map(); // district name → severity tier (single-state mode)
    let warningScope = null;          // null | 'district' | 'state' (single-state mode)
    let warningStateTier = null;      // tier for the whole-state wash, when scope === 'state' (single-state mode)
    let nationwideDistrictTiers = new Map(); // district name → severity tier (nationwide mode)
    let nationwideStateWash = new Map();     // stateCode → severity tier, vague state-wide warnings (nationwide mode)
    let nationwidePerState = new Map();      // stateCode → summary { tier, scope, districtCount, validTo, sources } (nationwide mode)
    let nationwideActiveWarnings = [];       // raw active warning objects, both sources (nationwide mode) — feeds the bottom summary bar's bulletin text
    let activeWarnings = [];          // filtered, currently-active warning objects
    let lastCheckedAt = null;
    let forecastToday = null;         // today's row from the forecast API, once fetched

    // ?testWarning= override — full syntax documented in weather-core.js.
    // Param NAME matched case-insensitively — manually-typed URLs can end
    // up with "testwarning" (e.g. mobile/TV keyboards lowercasing it).
    const TEST_WARNING_PARAM = (function () {
      for (const [key, value] of new URLSearchParams(window.location.search)) {
        if (key.toLowerCase() === 'testwarning') return value;
      }
      return null;
    })();

    // ?raw — shows a debug overlay with the actual unprocessed API
    // responses. All-lowercase (unlike ?testWarning=) so it can't be
    // mistyped into a different case.
    const RAW_PARAM = new URLSearchParams(window.location.search).has('raw');

    function showStateBanner(msg) {
      const el = document.getElementById('state-error-banner');
      el.textContent = msg;
      el.hidden = false;
    }

    // =========================================================
    // Theme toggle — localStorage['theme'] = 'dark'|'light', default
    // light. Same classList convention as root index.html: <html
    // class="light"> is already flipped pre-paint by the <head> script.
    // The basemap tile layer swaps to its dark/light counterpart to match.
    // =========================================================
    function initThemeToggle() {
      document.getElementById('theme-toggle').addEventListener('click', function () {
        const isDark = document.documentElement.classList.toggle('dark');
        document.documentElement.classList.toggle('light', !isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        // Recreate the tile layer from scratch rather than tileLayer.setUrl()
        // — setUrl()'s redraw() reuses the existing layer's internal zoom-level
        // container/transform state, which can end up stale relative to the
        // GeoJSON overlay at a fractional zoom (zoomSnap: 0), rendering the
        // basemap visibly offset until a real zoom/pan forces a recompute. A
        // freshly added layer computes its transform from scratch against the
        // CURRENT map view, so there's nothing stale to inherit.
        if (map && tileLayer) {
          map.removeLayer(tileLayer);
          initTileLayer();
        }
        if (stateBoundaryLayer) stateBoundaryLayer.setStyle({ color: stateBoundaryColor() });
      });
    }

    // =========================================================
    // Location popover — Negeri/Daerah selects tucked behind a pin-icon
    // toggle in the title, anchored via #brand-bar{position:relative}.
    // Only the show/hide chrome lives here; the selects' own change
    // handlers (populateStateSelect/populateDistrictSelect) are unchanged.
    // =========================================================
    function initLocationPopover() {
      const btn = document.getElementById('location-toggle');
      const pop = document.getElementById('location-popover');

      function open() {
        pop.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
        document.getElementById('stateSelect').focus();
      }
      function close(opts) {
        const refocus = opts && opts.refocus;
        if (pop.hidden) return;
        pop.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
        if (refocus) btn.focus();
      }

      btn.addEventListener('click', () => pop.hidden ? open() : close());

      document.addEventListener('click', (e) => {
        if (pop.hidden) return;
        // btn.contains(), not e.target !== btn — a click on the icon
        // button's inner <svg>/<path> has THAT as e.target, not the
        // button itself, so a strict !== check closed the popover in
        // the same click that just opened it.
        if (!pop.contains(e.target) && !btn.contains(e.target)) close();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !pop.hidden) close({ refocus: true });
      });

      // Auto-close after a district pick — the map pan + forecast-card
      // update are the visible confirmation. The state select's own change
      // handler navigates the whole page away, so it doesn't need this.
      document.getElementById('districtSelect').addEventListener('change', () => close());
    }

    // =========================================================
    // Nationwide summary bar — plain accordion toggle (not a popover,
    // stays open until clicked again, no outside-click-to-close).
    // Starts expanded each page load, by design — no persistence.
    // =========================================================
    function initNationwideSummaryToggle() {
      const btn = document.getElementById('nationwide-summary-toggle');
      const list = document.getElementById('nationwide-summary-list');
      const chevron = document.getElementById('nationwide-summary-chevron');

      btn.addEventListener('click', () => {
        const collapsed = !list.hidden;
        list.hidden = collapsed;
        btn.setAttribute('aria-expanded', String(!collapsed));
        chevron.style.transform = collapsed ? 'rotate(-90deg)' : '';
      });
    }

    // =========================================================
    // Live clock + date
    // =========================================================
    function renderClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent =
        now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('live-date').textContent =
        now.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    // =========================================================
    // Panel side — right for Peninsular states, left for Sabah/Sarawak
    // (they sit on the right half of the map, so the panel goes opposite).
    // Computed once in boot() after cfg resolves; states only change via
    // full page navigation (see populateStateSelect), so this never needs
    // to be recomputed mid-session.
    // =========================================================
    function applyPanelSide(side) {
      const el = document.getElementById('side-column');
      el.classList.toggle('right-4', side === 'right');
      el.classList.toggle('left-4', side === 'left');
    }

    // =========================================================
    // ?raw — debug overlay, appended directly to <body> so it always
    // covers the full real viewport regardless of any other layout.
    // Fetches the real endpoints fresh and shows each response's actual
    // text — not the normalized objects fetchActiveWarnings()/
    // fetchRainWarnings() return. The forecast source is only shown when
    // a district is actually resolvable — either already focused, or
    // given via ?district= directly (boot() may call this before the
    // async GeoJSON load has processed that preselect). Nationwide mode
    // has no single district to forecast, so that source is omitted there.
    // =========================================================
    function initRawDebugOverlay() {
      const overlay = document.createElement('div');
      overlay.className = 'raw-debug-overlay';
      overlay.innerHTML = '<h1>Data Mentah API (?raw)</h1>';
      document.body.appendChild(overlay);

      const sources = [
        ['Amaran Ribut Petir (warning)', buildWarningApiUrl(cfg)],
        ['Amaran Hujan Berterusan (rain proxy)', RAIN_PROXY_URL],
      ];

      const districtParam = new URLSearchParams(window.location.search).get('district');
      const forecastDistrict = focusDistrict ||
        (districtParam && cfg.districts.includes(districtParam) ? districtParam : null);
      if (forecastDistrict) {
        sources.unshift([
          `Ramalan Cuaca (forecast) — ${forecastDistrict}`,
          `https://api.data.gov.my/weather/forecast?contains=${encodeURIComponent(forecastDistrict)}@location__location_name`,
        ]);
      } else if (!isNationwide) {
        const note = document.createElement('div');
        note.className = 'raw-debug-note';
        note.textContent = 'Ramalan Cuaca tidak dipaparkan — belum ada daerah dipilih (guna ?district=).';
        overlay.appendChild(note);
      }

      sources.forEach(([label, url]) => {
        const section = document.createElement('section');
        section.className = 'raw-debug-section';
        section.innerHTML = `<h2>${escapeHtml(label)}</h2>` +
          `<div class="raw-debug-url">${escapeHtml(url)}</div>` +
          `<pre class="raw-debug-pre">Memuatkan…</pre>`;
        overlay.appendChild(section);
        const pre = section.querySelector('.raw-debug-pre');

        fetchWithTimeout(url, 8000)
          .then(res => res.text().then(text => ({ ok: res.ok, status: res.status, text })))
          .then(({ ok, status, text }) => {
            let body = text;
            try { body = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* not JSON — show raw text as-is */ }
            pre.textContent = (ok ? '' : `HTTP ${status}\n\n`) + body;
          })
          .catch(err => { pre.textContent = 'Gagal memuatkan: ' + err.message; });
      });
    }

    // =========================================================
    // Basemap tile layer — CARTO's label-free variants (no place names,
    // no roads emphasis), theme-matched. Sits in Leaflet's default
    // tilePane (zIndex 200), which already paints below the district
    // GeoJSON layer's default overlayPane (400) with no extra pane setup
    // needed. Swapped via .setUrl() on theme toggle rather than the old
    // CSS invert-filter trick — genuinely different tile sets per theme,
    // not just an inverted palette.
    // =========================================================
    function isDarkMode() {
      return document.documentElement.classList.contains('dark');
    }

    function tileUrlForTheme() {
      return isDarkMode()
        ? 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png';
    }

    // NOTE: hostname must be {s}.basemaps.cartocdn.com — an extra ".tile."
    // level breaks TLS (CARTO's wildcard cert covers one subdomain level
    // only), which silently killed the basemap with ERR_CERT_COMMON_NAME_INVALID.
    function initTileLayer() {
      tileLayer = L.tileLayer(tileUrlForTheme(), {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      }).addTo(map);
    }

    // =========================================================
    // Map — district layer. Interaction (drag/zoom/scroll) is enabled;
    // a dropdown selection still programmatically pans/zooms via
    // fitBounds()/setView(), same as before.
    // =========================================================
    // Grey (#8a8a8a) borders on every district regardless of warning
    // state — a local override so weather-core.js's shared defaultStyle
    // (also used by paparan/) never gets touched.
    const PAGE_DEFAULT_STYLE = { ...defaultStyle, color: '#8a8a8a' };

    // Nationwide mode draws a separate black state-boundary layer on top
    // (see buildStateBoundaryLayer()) at the CURRENT default thickness, so
    // every individual district border here can go thin — otherwise every
    // internal district line would visually compete with the real state
    // outlines. Single-state mode is untouched (weight 2, as before).
    const NATIONWIDE_DISTRICT_WEIGHT = 1;

    function baseStyle(feature) {
      const name = feature.properties.name;

      if (isNationwide) {
        const tier = nationwideDistrictTiers.get(name);
        if (tier) return { ...districtWarningStyle(tier), color: '#8a8a8a', weight: NATIONWIDE_DISTRICT_WEIGHT };
        // Vague "whole state, no district detail" wash — scoped to just
        // that state's own features via properties.state, since nationwide
        // mode renders every state at once (unlike single-state mode,
        // where a bare warningScope === 'state' flag was enough because
        // only one state's polygons were ever on screen).
        const wash = nationwideStateWash.get(feature.properties.state);
        if (wash) return { ...stateWarningStyle(wash), color: '#8a8a8a', weight: NATIONWIDE_DISTRICT_WEIGHT };
        return { ...PAGE_DEFAULT_STYLE, weight: NATIONWIDE_DISTRICT_WEIGHT };
      }

      const tier = warningDistricts.get(name);
      // District-specific tier paints on top even under a state-wide wash,
      // so "SEKSYEN A: <State> (Maran)" stays visible inside a vaguer
      // whole-state section from another bulletin.
      if (tier) return { ...districtWarningStyle(tier), color: '#8a8a8a', weight: 2 };
      if (warningScope === 'state') return { ...stateWarningStyle(warningStateTier), color: '#8a8a8a', weight: 2 };
      return PAGE_DEFAULT_STYLE;
    }

    // Dropdown "jump to district" selection — an outline-only override on
    // top of whatever fill baseStyle() would give, so a selected district
    // that's also under an active warning still shows its warning color.
    function selectionStyle(feature) {
      const base = baseStyle(feature);
      return Object.assign({}, base, {
        weight: 4,
        color: '#1d4ed8',
        fillOpacity: Math.min(1, (base.fillOpacity || 0.6) + 0.1)
      });
    }

    function repaintMap() {
      if (geojsonLayer) geojsonLayer.setStyle(baseStyle);
    }

    // Resets the map to the active state's own framing — cfg.center/zoom
    // when hand-tuned (Pahang), else fitBounds to whatever districts are
    // actually loaded (any other state, until it gets its own tuned value).
    function resetMapView() {
      if (cfg.center && cfg.zoom != null) {
        map.setView(cfg.center, cfg.zoom);
      } else if (geojsonLayer) {
        map.fitBounds(geojsonLayer.getBounds());
      }
    }

    // One label per state (nationwide mode only) — groups the already-
    // rendered district layers by feature.properties.state and places a
    // single tooltip at the combined bounds' center of each group, instead
    // of a per-district label for every district in the country at once.
    function addStateLabels() {
      const stateNameByCode = {};
      Object.values(STATE_CONFIG).forEach(s => {
        if (s.stateCode) stateNameByCode[s.stateCode] = s.displayName;
      });

      const layersByState = new Map();
      geojsonLayer.eachLayer(layer => {
        const code = layer.feature.properties.state;
        if (!layersByState.has(code)) layersByState.set(code, []);
        layersByState.get(code).push(layer);
      });

      layersByState.forEach((layers, code) => {
        const center = L.featureGroup(layers).getBounds().getCenter();
        L.tooltip({
          permanent: true, direction: 'center',
          className: 'state-label-pill bg-white/90 dark:bg-zinc-900/90 border border-zinc-200 dark:border-zinc-700 rounded-full px-3.5 py-1 text-sm font-bold font-display text-zinc-900 dark:text-zinc-100 shadow-sm whitespace-nowrap backdrop-blur-sm'
        })
          .setLatLng(center)
          .setContent(stateNameByCode[code] || code)
          .addTo(map);
      });
    }

    // Black reads fine on the light basemap but disappears against the
    // dark theme's near-black map background (#05070c) — flip to white
    // in dark mode so the state outline stays visible either way.
    function stateBoundaryColor() {
      return document.documentElement.classList.contains('dark') ? '#ffffff' : '#000000';
    }

    // Real state-boundary outlines for nationwide mode — dissolves every
    // district polygon sharing the same properties.state into one merged
    // outline per state, via Turf.js (there's no separate state-level
    // GeoJSON source, only the district one). Weight matches the CURRENT
    // thickness districts used to have (2, from weather-core.js's shared
    // defaultStyle) — only the colour changes (to black/white depending on
    // theme, see stateBoundaryColor); districts themselves go thin (see
    // NATIONWIDE_DISTRICT_WEIGHT above) so this layer reads as the real
    // state border, not just another district line at the same weight.
    //
    // A plain turf.dissolve() on the raw district polygons barely merges
    // anything (verified offline: 59 districts across 6 states dissolved
    // down to only 51 features, should be ~6-10) — adjacent districts'
    // shared edges in jakim.geojson aren't quite coincident, so dissolve's
    // edge-matching mostly fails and leaves near-duplicate borders drawn
    // right on top of each other, which is what actually produced the
    // jagged/doubled look, not float rendering noise. Fix: pad every
    // district out by a few km first (closes those tiny seam gaps so
    // dissolve's edges genuinely overlap), dissolve, then shrink back by
    // the same amount to restore the true outline — the standard
    // "buffer-dissolve-unbuffer" trick for imperfectly-topologized source
    // polygons. Verified offline against the real dataset: nationwide
    // round-trip area lands within ~1% of the un-padded total, and
    // genuinely separate pieces (real offshore islands, e.g. Pahang's
    // Tioman) correctly remain their own polygon rather than being forced
    // to merge into the mainland.
    const STATE_BOUNDARY_BUFFER_KM = 3;

    function buildStateBoundaryLayer(districtFeatureCollection) {
      if (typeof turf === 'undefined') {
        console.warn('[weather] turf.js failed to load — state borders unavailable, districts keep their thin grey borders only.');
        return null;
      }
      try {
        const padded = {
          type: 'FeatureCollection',
          features: turf.flatten(districtFeatureCollection).features.map(f => {
            const b = turf.buffer(f, STATE_BOUNDARY_BUFFER_KM, { units: 'kilometers' });
            b.properties = f.properties;
            return b;
          }),
        };
        const dissolved = turf.dissolve(padded, { propertyName: 'state' });
        const shrunk = {
          type: 'FeatureCollection',
          features: dissolved.features.map(f => {
            const b = turf.buffer(f, -STATE_BOUNDARY_BUFFER_KM, { units: 'kilometers' });
            if (!b || !b.geometry) return f; // erosion collapsed a sliver — keep the padded shape rather than drop it
            b.properties = f.properties;
            return b;
          }),
        };
        return L.geoJSON(shrunk, {
          style: { color: stateBoundaryColor(), weight: 2, fill: false, interactive: false },
          interactive: false,
        });
      } catch (e) {
        console.warn('[weather] State-boundary dissolve failed:', e.message);
        return null;
      }
    }

    function loadGeoJSON() {
      fetchWithTimeout(GEOJSON_URL, 8000)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          const stateData = {
            type: "FeatureCollection",
            features: isNationwide ? data.features : data.features.filter(f => f.properties.state === cfg.stateCode)
          };

          geojsonLayer = L.geoJSON(stateData, {
            style: baseStyle,
            onEachFeature: (feature, layer) => {
              // Nationwide mode shows one label per STATE instead (see
              // addStateLabels() below) — a per-district label for every
              // district in the country at once is unreadable clutter.
              if (isNationwide) return;
              layer.bindTooltip(feature.properties.name, {
                permanent: true, direction: 'center',
                className: 'district-label-pill bg-white/90 dark:bg-zinc-900/90 border border-zinc-200 dark:border-zinc-700 rounded-full px-2.5 py-0.5 text-xs font-semibold text-zinc-900 dark:text-zinc-100 shadow-sm whitespace-nowrap backdrop-blur-sm'
              });
            }
          }).addTo(map);

          if (isNationwide) {
            addStateLabels();
            stateBoundaryLayer = buildStateBoundaryLayer(stateData);
            if (stateBoundaryLayer) stateBoundaryLayer.addTo(map);
          }

          resetMapView();
          refreshWarnings(); // initial load — map is already visible by now

          const preselect = new URLSearchParams(window.location.search).get('district');
          if (preselect && cfg.districts.includes(preselect)) {
            document.getElementById('districtSelect').value = preselect;
            highlightByName(preselect);
          }
        })
        .catch(err => {
          console.warn('[weather] Failed to load district map:', err.message);
          const mapDiv = document.getElementById('map');
          mapDiv.classList.add('flex', 'items-center', 'justify-center', 'text-center', 'px-8', 'text-lg', 'text-zinc-500', 'dark:text-zinc-400');
          mapDiv.textContent = 'Peta tidak dapat dimuatkan. Sila cuba muat semula halaman.';
        });
    }

    /**
     * Single entry point for "district selection changed" — drives both
     * the map highlight/zoom and the forecast card. Called from the
     * district select's change handler and the boot-time ?district=
     * preselect.
     */
    function highlightByName(name) {
      focusDistrict = name || null;
      forecastToday = null;
      renderForecast(); // placeholder / new name immediately, no stale data flash
      if (focusDistrict) refreshForecast();

      if (!name) {
        repaintMap();
        resetMapView();
        return;
      }

      geojsonLayer.eachLayer(function (layer) {
        if (layer.feature.properties.name === name) {
          layer.setStyle(selectionStyle(layer.feature));
          layer.bringToFront();
          map.fitBounds(layer.getBounds(), { padding: [20, 20] });
        } else {
          geojsonLayer.resetStyle(layer);
        }
      });
    }

    // Populates #districtSelect from cfg.districts — replaces whatever
    // was there for the previously-active state (or the empty placeholder
    // on first boot). Only ever runs once per page load (choosing a
    // different state navigates via location.search, see
    // populateStateSelect()), so the change listener added here can't
    // end up double-bound.
    function populateDistrictSelect() {
      const sel = document.getElementById('districtSelect');
      sel.innerHTML = '<option value="">-- Pilih Daerah --</option>' +
        cfg.districts.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
      // Nationwide mode (cfg.districts === []) has no single district to
      // jump to — disable rather than leave an active-looking select with
      // only the placeholder option.
      sel.disabled = cfg.districts.length === 0;
      sel.addEventListener('change', () => highlightByName(sel.value));
    }

    // Populates #stateSelect from STATE_CONFIG once, at boot. Choosing a
    // state navigates (full reload) rather than swapping data in place —
    // simplest way to fully reset map/geojson/dropdown state, matching
    // this page's existing non-SPA style.
    function populateStateSelect(activeKey) {
      const sel = document.getElementById('stateSelect');
      sel.innerHTML = Object.entries(STATE_CONFIG)
        .map(([key, s]) => `<option value="${escapeHtml(key)}"${key === activeKey ? ' selected' : ''}>${escapeHtml(s.displayName)}</option>`)
        .join('');
      sel.addEventListener('change', () => {
        const params = new URLSearchParams(window.location.search);
        params.set('state', sel.value);
        params.delete('district'); // districts don't carry over between states
        window.location.search = params.toString();
      });
    }

    // =========================================================
    // Warning cards — two FIXED cards, one per source.
    // =========================================================
    function newestFirst(list) {
      return list.slice().sort((a, b) =>
        new Date(b.warning_issue?.issued || 0) - new Date(a.warning_issue?.issued || 0));
    }

    // 'amaran' (thunderstorm/rain-lebat, untiered) reads as "Ribut Petir /
    // Hujan Lebat" in the UI, matching the card title and legend — the
    // raw TIER_LABEL value ("Amaran") is too generic on its own here.
    function tierRowLabel(tier) {
      return tier === 'amaran' ? 'Ribut Petir / Hujan Lebat' : (TIER_LABEL[tier] || tier);
    }

    function relPast(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      const mins = Math.floor((Date.now() - d.getTime()) / 60000);
      if (mins < 1) return 'Sebentar tadi';
      if (mins < 60) return `${mins} minit lepas`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? `${h} jam ${m} minit lepas` : `${h} jam lepas`;
    }

    function relFuture(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      const mins = Math.floor((d.getTime() - Date.now()) / 60000);
      if (mins < 0) return 'Tamat tempoh';
      if (mins < 1) return 'Kurang 1 minit lagi';
      if (mins < 60) return `${mins} minit lagi`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? `${h} jam ${m} minit lagi` : `${h} jam lagi`;
    }

    function formatTimeShort(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    const WARN_CARD_BASE = 'rounded-xl border border-zinc-200 dark:border-zinc-700 border-l-8 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md shadow-lg p-4 shrink-0';

    function renderWarnCard(el, title, items, marineCount) {
      if (!items.length) {
        el.className = WARN_CARD_BASE + ' opacity-60';
        el.style.borderLeftColor = 'transparent';
        el.innerHTML = `
          <div class="flex items-baseline gap-2.5 pb-2 border-b border-zinc-200 dark:border-zinc-700">
            <h2 class="font-display font-bold text-base text-zinc-900 dark:text-zinc-100 m-0">Tiada ${escapeHtml(title)}</h2>
          </div>
          ${marineCount ? `<div class="text-sm text-sky-500 dark:text-sky-400 mt-2">🌊 Amaran perairan ${escapeHtml(cfg.displayName)} sahaja aktif (bukan kawasan darat)</div>` : ''}`;
        return;
      }

      const w = items[0];
      const parsed = stateScopeOf(w, cfg);
      // Highest tier among this warning's districts drives the accent colour.
      let accentTier = parsed.tier || 'amaran';
      Object.values(parsed.tiers || {}).forEach(t => {
        if (TIER_RANK[t] > TIER_RANK[accentTier]) accentTier = t;
      });

      // One pill per district, coloured by its severity tier — the
      // bulletin's full text is deliberately NOT shown: MET publishes one
      // nationwide bulletin listing every state, which is noise here.
      const pill = (label, tier) => {
        const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
        const textColor = tier === 'waspada' ? '#713f12' : '#ffffff';
        return `<span class="inline-block rounded-full px-3 py-1 text-sm font-bold shadow-sm whitespace-nowrap" style="background:${c.fill};color:${textColor}">${escapeHtml(label)}</span>`;
      };

      // Group districts by tier so each severity gets its own row — MET's
      // bulletins only ever carry ONE valid_to per bulletin, so every row
      // below intentionally reuses the same warning-level "sehingga" value.
      let rowsHtml = '';
      if (parsed.scope !== 'marine') {
        const groups = new Map(); // tier -> [district label, ...]
        if (parsed.scope === 'state') {
          groups.set(accentTier, [`Seluruh ${cfg.displayName}`]);
        } else {
          parsed.districts.forEach(d => {
            const t = (parsed.tiers && parsed.tiers[d]) || 'amaran';
            if (!groups.has(t)) groups.set(t, []);
            groups.get(t).push(d);
          });
        }
        const tiersSorted = [...groups.keys()].sort((a, b) => TIER_RANK[b] - TIER_RANK[a]);
        const sehinggaShort = w.valid_to ? (formatTimeShort(w.valid_to) || '—') : '—';
        const sehinggaRel = w.valid_to ? (relFuture(w.valid_to) || '') : '';
        rowsHtml = tiersSorted.map(tier => {
          const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
          const districtsHtml = groups.get(tier).slice().sort((a, b) => a.localeCompare(b))
            .map(d => pill(d, tier)).join('');
          return `
            <div class="py-2 border-t border-zinc-200 dark:border-zinc-700 first:border-t-0 first:pt-0">
              <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded shrink-0" style="background:${c.fill}"></span>
                <span class="text-base font-semibold text-zinc-900 dark:text-zinc-100">${escapeHtml(tierRowLabel(tier))}</span>
              </div>
              <div class="text-sm text-zinc-500 dark:text-zinc-400 mt-0.5 mb-1.5">sehingga ${escapeHtml(sehinggaShort)}${sehinggaRel ? ` · <span class="font-semibold text-zinc-900 dark:text-zinc-100">${escapeHtml(sehinggaRel)}</span>` : ''}</span>
              <div class="flex flex-wrap gap-2">${districtsHtml}</div>
            </div>`;
        }).join('');
      }

      const issued = w.warning_issue?.issued;
      const issuedShort = issued ? (formatTimeShort(issued) || '—') : '—';
      const issuedRel = issued ? (relPast(issued) || '') : '';
      const more = items.length > 1 ? `+${items.length - 1} lagi` : '';

      el.className = WARN_CARD_BASE + (accentTier === 'bahaya' ? ' tier-bahaya-active' : '');
      el.style.borderLeftColor = (TIER_COLORS[accentTier] || TIER_COLORS.amaran).fill;
      el.innerHTML = `
        <div class="pb-2 border-b border-zinc-200 dark:border-zinc-700 mb-1">
          <div class="flex items-center gap-2">
            ${accentTier === 'bahaya' ? '<span class="pulse-dot shrink-0"></span>' : ''}
            <h2 class="font-display font-bold text-lg text-zinc-900 dark:text-zinc-100 m-0">${escapeHtml(title)}</h2>
            ${more ? `<span class="text-sm font-semibold text-zinc-500 dark:text-zinc-400 whitespace-nowrap">${escapeHtml(more)}</span>` : ''}
          </div>
          <div class="text-sm font-medium text-zinc-500 dark:text-zinc-400 mt-0.5">Dikeluarkan ${escapeHtml(issuedShort)}${issuedRel ? ` · <span class="font-semibold text-zinc-900 dark:text-zinc-100">${escapeHtml(issuedRel)}</span>` : ''}</div>
        </div>
        ${rowsHtml}
        ${(marineCount || parsed.scope === 'marine') ? `<div class="text-sm text-sky-500 dark:text-sky-400 mt-2">🌊 Amaran perairan ${escapeHtml(cfg.displayName)} aktif (bukan kawasan darat)</div>` : ''}`;
    }

    function renderCards() {
      const thunderCard = document.getElementById('card-thunder');
      const rainCard = document.getElementById('card-rain');

      // Nationwide mode has no single cfg to scope stateScopeOf()/pill
      // wording against (cfg.apiName is null — calling into it here would
      // throw) — the coloured map + the plain-text summary panel already
      // communicate where warnings are; these two per-state cards stay
      // hidden until a real state is picked from the Negeri select.
      if (isNationwide) {
        thunderCard.hidden = true;
        rainCard.hidden = true;
        return;
      }

      const rain = newestFirst(activeWarnings.filter(w => w.source === 'rain'));
      const others = newestFirst(activeWarnings.filter(w => w.source !== 'rain'));
      const land = others.filter(w => stateScopeOf(w, cfg).scope !== 'marine');
      const marineCount = others.length - land.length;

      // Thunder card: ALWAYS visible, even with zero active warnings —
      // renderWarnCard's empty branch shows "Tiada Ribut Petir / Hujan Lebat".
      thunderCard.hidden = false;
      renderWarnCard(thunderCard, 'Ribut Petir / Hujan Lebat', land, marineCount);

      // Rain card: hide the WHOLE card (not an empty placeholder) when
      // there's nothing to show — unlike the thunder card above.
      if (rain.length === 0) {
        rainCard.hidden = true;
      } else {
        rainCard.hidden = false;
        renderWarnCard(rainCard, 'Amaran Hujan Berterusan', rain, 0);
      }
    }

    // =========================================================
    // Nationwide bottom warning bar — one flowing bulletin-style block per
    // warning type (thunderstorm / continuous rain), reusing MET's own
    // Malay bulletin wording almost verbatim instead of reconstructing a
    // state-by-state summary — real bulletins already read as one sentence
    // spanning every affected state (confirmed live, 2026-08-22:
    // "Ribut petir, hujan lebat dan angin kencang dijangka di negeri
    // Terengganu (Besut, Setiu, Kuala Nerus dan Kuala Terengganu) •
    // Sarawak: Kapit (Bukit Mabong dan Belaga)... sehingga 1:00 Pagi;
    // Ahad, 23 Ogos 2026."), so this just slices out the state/district
    // list and re-renders MET's own header ("sehingga ...") from
    // `valid_to` instead of parsing it back out of the sentence.
    // =========================================================

    // Slices "<preamble> di negeri <BODY> sehingga <time>; <date>." down
    // to just <BODY> — the state/district list is the only part worth
    // showing since the header row already carries the warning type and
    // the "sehingga" time separately.
    function extractBulletinBody(textBm) {
      const startMatch = textBm.match(/\bdi (?:negeri|kawasan)\s+/i);
      const body = startMatch ? textBm.slice(startMatch.index + startMatch[0].length) : textBm;
      return body.replace(/\s*sehingga\s+[\s\S]*$/i, '').trim();
    }

    // Lazily built once STATE_CONFIG is loaded — bolds any real state's
    // displayName wherever it appears in the (already-escaped) body text.
    // Best-effort only: text_bm uses each state's own Malay name, which for
    // Penang/Melaka may not exactly equal states.json's `displayName` (see
    // the English-text spelling landmine already documented in
    // weather-core.js's extractStateDistricts) — worst case those two
    // states just don't get bolded, the text itself is unaffected.
    let stateNameBoldRe = null;
    function boldStateNames(escapedBody) {
      if (!stateNameBoldRe) {
        const names = Object.values(STATE_CONFIG).map(s => s.displayName).filter(Boolean)
          .sort((a, b) => b.length - a.length).map(escapeRegExp);
        stateNameBoldRe = new RegExp('\\b(' + names.join('|') + ')\\b', 'g');
      }
      return escapedBody.replace(stateNameBoldRe, '<strong>$1</strong>');
    }

    // A warning's raw text can also be a marine-only bulletin ("perairan
    // ...") that happens to mention a state name in passing — excluded the
    // same way computeWarningStateNationwide() already excludes it from
    // the map (scope 'marine'/null), so it never appears as a false
    // "Ribut Petir" block here.
    function warningHasLandScope(w, stateCfgs) {
      return stateCfgs.some(cfg => {
        const parsed = w.source === 'rain' ? parseRainForState(w.text_en || w.text_bm, cfg) : extractStateDistricts(w, cfg);
        return parsed.scope && parsed.scope !== 'marine';
      });
    }

    // Highest tier across every real state this group of warnings touches
    // — drives the block's left accent colour. Thunderstorm ('amaran')
    // warnings are always untiered so this just confirms 'amaran'; rain
    // warnings can carry real waspada/buruk/bahaya tiers per SECTION.
    function dominantTier(group, stateCfgs) {
      let tier = 'amaran';
      group.forEach(w => {
        stateCfgs.forEach(cfg => {
          const parsed = w.source === 'rain' ? parseRainForState(w.text_en || w.text_bm, cfg) : extractStateDistricts(w, cfg);
          if (parsed.tier && TIER_RANK[parsed.tier] > TIER_RANK[tier]) tier = parsed.tier;
          Object.values(parsed.tiers || {}).forEach(t => { if (TIER_RANK[t] > TIER_RANK[tier]) tier = t; });
        });
      });
      return tier;
    }

    function renderNationwidePanel() {
      const bar = document.getElementById('nationwide-summary-bar');
      const list = document.getElementById('nationwide-summary-list');
      const countChip = document.getElementById('nationwide-summary-count');
      if (!isNationwide) { bar.hidden = true; return; }
      bar.hidden = false;

      const stateCfgs = Object.values(STATE_CONFIG).filter(s => s.apiName && s.stateCode);
      const relevant = nationwideActiveWarnings.filter(w => warningHasLandScope(w, stateCfgs));
      const groups = [
        { label: 'Ribut Petir / Hujan Lebat', items: relevant.filter(w => w.source !== 'rain') },
        { label: 'Hujan Berterusan', items: relevant.filter(w => w.source === 'rain') },
      ].filter(g => g.items.length);

      list.innerHTML = groups.length
        ? groups.map(g => {
            const tier = dominantTier(g.items, stateCfgs);
            const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
            const w = g.items[0]; // MET issues one active bulletin per category at a time
            const sehingga = w.valid_to
              ? `${new Date(w.valid_to).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })}, ${new Date(w.valid_to).toLocaleDateString('ms-MY', { day: 'numeric', month: 'long', year: 'numeric' })}`
              : '—';
            const body = boldStateNames(escapeHtml(extractBulletinBody(w.text_bm || w.text_en || '')));
            return `
              <li class="py-2 border-t border-zinc-100 dark:border-zinc-800 first:border-t-0 first:pt-0">
                <div class="flex items-baseline gap-2">
                  <span class="w-3 h-3 rounded shrink-0" style="background:${c.fill}"></span>
                  <span class="font-semibold text-zinc-900 dark:text-zinc-100">${escapeHtml(g.label)}:</span>
                  <span class="ml-auto text-xs font-semibold text-zinc-500 dark:text-zinc-400 whitespace-nowrap">sehingga ${escapeHtml(sehingga)}</span>
                </div>
                <p class="mt-1 leading-relaxed">${body}</p>
              </li>`;
          }).join('')
        : '<li class="py-1">Tiada amaran aktif di seluruh Malaysia</li>';

      countChip.hidden = nationwidePerState.size === 0;
      countChip.textContent = nationwidePerState.size;
    }

    function updateFooter() {
      const timeText = lastCheckedAt
        ? lastCheckedAt.toLocaleString('ms-MY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
        : '—';
      const text = `Dikemaskini ${timeText} · Auto setiap 3 minit`;
      document.getElementById('footer-updated').textContent = text;
      if (isNationwide) {
        document.getElementById('nationwide-summary-footer').textContent =
          `Sumber data: MET Malaysia / data.gov.my · ${text}`;
      }
    }

    // Nationwide mode: one thunderstorm fetch (buildWarningApiUrl omits
    // contains= when cfg.apiName is null, see weather-core.js) + one rain
    // fetch (fetchRainWarningsRaw — the proxy was already unfiltered),
    // aggregated across all 16 states in memory by
    // computeWarningStateNationwide(). ?testWarning= fixtures are
    // single-cfg only (getTestWarningFixture needs a real cfg.apiName)
    // and are simply ignored here — ?raw/live data is used instead.
    async function refreshWarningsNationwide() {
      const [thunder, rain] = await Promise.allSettled([
        fetchActiveWarnings(cfg),
        fetchRainWarningsRaw(),
      ]);

      if (thunder.status === 'rejected' && rain.status === 'rejected') {
        console.warn('[weather] Both warning sources failed:', thunder.reason?.message, rain.reason?.message);
      } else {
        if (thunder.status === 'rejected') console.warn('[weather] data.gov.my warnings failed:', thunder.reason?.message);
        if (rain.status === 'rejected') console.warn('[weather] rain proxy failed (expected under local static server):', rain.reason?.message);
        const combined = [
          ...(thunder.status === 'fulfilled' ? thunder.value : []),
          ...(rain.status === 'fulfilled' ? rain.value : []),
        ];
        const state = computeWarningStateNationwide(combined, STATE_CONFIG);
        nationwideDistrictTiers = state.districts;
        nationwideStateWash = state.stateWash;
        nationwidePerState = state.perState;
        nationwideActiveWarnings = combined.filter(isWarningActive);
      }
    }

    async function refreshWarnings() {
      lastCheckedAt = new Date();

      if (isNationwide) {
        await refreshWarningsNationwide();
        repaintMap();
        renderCards();
        renderNationwidePanel();
        applyForecastWarningAccent();
        updateFooter();
        return;
      }

      const fixture = getTestWarningFixture(TEST_WARNING_PARAM, cfg);
      if (fixture !== undefined) {
        activeWarnings = fixture.filter(isWarningActive);
        const state = computeWarningState(activeWarnings, cfg);
        warningScope = state.scope;
        warningDistricts = state.districts;
        warningStateTier = state.stateTier;
      } else {
        // Two independent sources, fetched in parallel — either failing
        // alone must not take down the other (rain proxy 404s under local
        // static servers by design; data.gov.my can have its own bad day).
        const [thunder, rain] = await Promise.allSettled([
          fetchActiveWarnings(cfg),
          fetchRainWarnings(cfg),
        ]);

        if (thunder.status === 'rejected' && rain.status === 'rejected') {
          console.warn('[weather] Both warning sources failed:', thunder.reason?.message, rain.reason?.message);
          // Leave the previously-known state on screen rather than clearing
          // it to a false "no warning" on a transient failure.
        } else {
          if (thunder.status === 'rejected') console.warn('[weather] data.gov.my warnings failed:', thunder.reason?.message);
          if (rain.status === 'rejected') console.warn('[weather] rain proxy failed (expected under local static server):', rain.reason?.message);
          activeWarnings = [
            ...(thunder.status === 'fulfilled' ? thunder.value : []),
            ...(rain.status === 'fulfilled' ? rain.value : []),
          ];
          const state = computeWarningState(activeWarnings, cfg);
          warningScope = state.scope;
          warningDistricts = state.districts;
          warningStateTier = state.stateTier;
        }
      }

      repaintMap();
      renderCards();
      applyForecastWarningAccent();
      updateFooter();
    }

    function initTestModeBanner() {
      if (!TEST_WARNING_PARAM) return;
      const el = document.getElementById('test-mode-banner');
      el.hidden = false;
      el.textContent = `🧪 MOD UJIAN AKTIF — testWarning=${TEST_WARNING_PARAM} (data ujian, bukan amaran sebenar)`;
    }

    // =========================================================
    // Forecast (daily granularity — Pagi/Petang/Malam + min–maks),
    // follows `focusDistrict` (settable via the district select) via the
    // by-name MET lookup (contains=<name>@location__location_name).
    // =========================================================
    function localDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Finite set of Malay phrases from the API → icon. Unmapped phrases warn
    // instead of silently showing the wrong sky. 'berangin' (windy) has no
    // matching symbol in the sprite, so it still falls back to an emoji.
    function forecastIcon(phrase, slot) {
      const p = (phrase || '').toLowerCase();
      if (!p) return '—';

      const svg = (inner) => `<svg class="wicon" viewBox="0 0 100 100">${inner}</svg>`;

      if (p.includes('ribut petir')) {
        return svg(
          '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
          '<use href="#wicon-gray-cloud" x="25" y="10" class="w-cloud-float-reverse" fill="url(#gradDarkGray)"/>' +
          '<use href="#wicon-thunder-bolt" x="30" y="61" class="w-lighting"/>' +
          '<use href="#wicon-white-cloud" x="7"/>' +
          '<use href="#wicon-thunder-bolt" x="45" y="56" class="w-lighting w-delay-1"/>'
        );
      }

      if (p.includes('tiada hujan')) {
        return slot === 'malam'
          ? svg(
            '<use href="#wicon-moon" x="-15"/>' +
            '<use href="#wicon-star" x="42" y="30" class="w-star"/>' +
            '<use href="#wicon-star" x="61" y="32" class="w-star w-delay-1"/>' +
            '<use href="#wicon-star" x="55" y="50" class="w-star w-delay-2"/>'
          )
          : svg('<use href="#wicon-sun"/>');
      }

      if (p.includes('hujan')) {
        if (p.includes('beberapa') || p.includes('satu dua')) {
          return slot === 'malam'
            ? svg(
              '<use href="#wicon-moon" x="-20" y="-15"/>' +
              '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
              '<use href="#wicon-rain-drop" x="25" y="65" class="w-drop1"/>' +
              '<use href="#wicon-rain-drop" x="45" y="65" class="w-drop3"/>' +
              '<use href="#wicon-white-cloud" x="7"/>'
            )
            : svg(
              '<use href="#wicon-sun" x="-12" y="-18"/>' +
              '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
              '<use href="#wicon-rain-drop" x="25" y="65" class="w-drop1"/>' +
              '<use href="#wicon-rain-drop" x="45" y="65" class="w-drop3"/>' +
              '<use href="#wicon-white-cloud" x="7"/>'
            );
        }
        return svg(
          '<use href="#wicon-gray-cloud" x="25" y="10" class="w-cloud-float-reverse" fill="url(#gradDarkGray)"/>' +
          '<use href="#wicon-rain-drop" x="15" y="65" class="w-drop4"/>' +
          '<use href="#wicon-rain-drop" x="25" y="65" class="w-drop1"/>' +
          '<use href="#wicon-rain-drop" x="37" y="65" class="w-drop2"/>' +
          '<use href="#wicon-rain-drop" x="50" y="65" class="w-drop3"/>' +
          '<use href="#wicon-white-cloud" x="5" y="-7"/>'
        );
      }

      if (p.includes('jerebu')) {
        return svg(
          '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradDarkGray)" x="0" y="20"/>' +
          '<use href="#wicon-gray-cloud" x="30" y="30" class="w-cloud-float-reverse" fill="url(#gradGray)"/>' +
          '<use href="#wicon-mist" x="0" y="30" class="w-mist"/>'
        );
      }

      if (p.includes('berangin')) return '💨';

      if (p.includes('berawan') || p.includes('mendung')) {
        return svg(
          '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
          '<use href="#wicon-white-cloud" x="7"/>'
        );
      }

      console.warn('[weather] Unmapped forecast phrase:', phrase);
      return svg(
        '<use href="#wicon-sun" x="-12" y="-18"/>' +
        '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
        '<use href="#wicon-white-cloud" x="7"/>'
      );
    }

    function tierWash(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyForecastWarningAccent() {
      const tier = focusDistrict
        ? (warningDistricts.get(focusDistrict) || (warningScope === 'state' ? warningStateTier : null))
        : null;

      const head = document.getElementById('forecast-head');
      const badge = document.getElementById('forecast-warn-badge');

      if (tier) {
        const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
        head.style.borderColor = c.fill;
        head.style.backgroundColor = tierWash(c.fill, 0.18);
        badge.querySelector('.tier-swatch').style.background = c.fill;
        badge.querySelector('.tier-label').textContent = tierRowLabel(tier);
        badge.hidden = false;
      } else {
        head.style.borderColor = 'transparent';
        head.style.backgroundColor = 'transparent';
        badge.hidden = true;
      }
    }

    function renderForecast() {
      const card = document.getElementById('forecast-card');

      // No district picked yet — hide the whole card rather than showing
      // it full of "—" placeholders. card starts `hidden` in the markup
      // too, so there's no flash of an empty card before this runs.
      if (!focusDistrict) {
        card.hidden = true;
        return;
      }
      card.hidden = false;

      applyForecastWarningAccent();
      document.getElementById('forecast-district-name').textContent = focusDistrict;

      if (!forecastToday) {
        // District just picked, first fetch hasn't landed yet — keep "—"
        // placeholders (never show stale data from a prior district).
        document.getElementById('forecast-temp').textContent = '—';
        ['pagi', 'petang', 'malam'].forEach(slot => {
          document.getElementById(`slot-icon-${slot}`).textContent = '—';
          document.getElementById(`slot-text-${slot}`).textContent = '—';
        });
        return;
      }

      const f = forecastToday;
      document.getElementById('forecast-temp').textContent =
        (f.min_temp != null && f.max_temp != null) ? `${f.min_temp}° – ${f.max_temp}°` : '—';
      [['pagi', f.morning_forecast], ['petang', f.afternoon_forecast], ['malam', f.night_forecast]]
        .forEach(([slot, phrase]) => {
          document.getElementById(`slot-icon-${slot}`).innerHTML = forecastIcon(phrase, slot);
          document.getElementById(`slot-text-${slot}`).textContent = phrase || '—';
        });
    }

    async function refreshForecast() {
      if (!focusDistrict) { renderForecast(); return; }
      try {
        const url = `https://api.data.gov.my/weather/forecast?contains=${encodeURIComponent(focusDistrict)}@location__location_name`;
        const resp = await fetchWithTimeout(url, 8000);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const rows = await resp.json();
        // API sorts date-DESCENDING — limit= would return the FURTHEST
        // days, so fetch all and pick today explicitly.
        const today = localDateStr(new Date());
        const row = (Array.isArray(rows) ? rows : []).find(r => r.date === today);
        if (row) forecastToday = row;
        renderForecast();
      } catch (e) {
        // Keep last-known forecast on screen; placeholders only before
        // the first-ever success for this district.
        console.warn('[weather] Forecast fetch failed:', e.message);
      }
    }

    // =========================================================
    // Boot + refresh loop
    // =========================================================
    async function boot() {
      try {
        STATE_CONFIG = await loadStateConfig();
      } catch (e) {
        console.warn('[weather] Failed to load states.json:', e.message);
        showStateBanner('Gagal memuatkan konfigurasi negeri (states.json). Sila cuba muat semula halaman.');
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const stateKey = (params.get('state') || 'malaysia').toLowerCase();
      cfg = STATE_CONFIG[stateKey];
      if (!cfg) {
        showStateBanner(`Negeri tidak dikenali: "${params.get('state')}" — kembali ke Malaysia.`);
        cfg = STATE_CONFIG['malaysia'] || Object.values(STATE_CONFIG)[0];
      }
      isNationwide = !cfg.stateCode;
      document.getElementById('page-footer').hidden = isNationwide;

      document.title = `Cuaca ${cfg.displayName} — Amaran & Peta Daerah`;
      document.getElementById('page-heading').textContent = `Cuaca ${cfg.displayName}`;

      applyPanelSide((cfg.stateCode === 'SBH' || cfg.stateCode === 'SWK') ? 'left' : 'right');

      populateStateSelect(stateKey in STATE_CONFIG ? stateKey : 'malaysia');
      populateDistrictSelect();
      initLocationPopover();
      initNationwideSummaryToggle();
      initThemeToggle();
      renderClock();
      renderForecast(); // hides the forecast card immediately (no district picked yet)
      renderCards();    // paint both empty warning-card states immediately, before first fetch
      renderNationwidePanel();

      // =========================================================
      // Initialize Map — interaction enabled (real page, not a kiosk).
      // The district select's fitBounds/setView calls still work
      // regardless — the viewer can then freely pan/zoom afterward.
      // =========================================================
      map = L.map('map', {
        zoomControl: true,
        dragging: true,
        scrollWheelZoom: true,
        doubleClickZoom: true,
        boxZoom: true,
        keyboard: true,
        touchZoom: true,
        zoomSnap: 0, // no rounding — needed so cfg.zoom's fractional values (e.g. Pahang's 8.7) aren't snapped to an integer
      }).setView(cfg.center || [4.2105, 108.9758], cfg.zoom || 6); // provisional — resetMapView() (after GeoJSON loads) corrects this for auto-fit states

      initTileLayer();

      initTestModeBanner();
      if (RAW_PARAM) initRawDebugOverlay();
      loadGeoJSON();

      // No point polling on an interval when serving a static fixture —
      // ?testWarning= is meant to be reloaded manually to test a new value.
      if (!TEST_WARNING_PARAM) {
        setInterval(() => {
          if (geojsonLayer) refreshWarnings();
        }, REFRESH_MS);

        // Throttled: rapid tab-switching must not burst requests at
        // data.gov.my (per-IP rate limit → HTTP 429). The 3-min interval
        // above still guarantees freshness.
        const VISIBILITY_MIN_GAP_MS = 60 * 1000;
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible' || !geojsonLayer) return;
          if (lastCheckedAt && (Date.now() - lastCheckedAt.getTime()) < VISIBILITY_MIN_GAP_MS) return;
          refreshWarnings();
        });
      }

      setInterval(() => { if (focusDistrict) refreshForecast(); }, FORECAST_REFRESH_MS);

      // Minute tick: keep "X minit lepas / lagi" honest and refresh the clock.
      setInterval(() => {
        renderCards();
        renderClock();
      }, TICK_MS);
    }

    boot();
  </script>

</body>

</html>
