<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="600">
    <title>Asma-ul-Husna — Paparan Hari Ini | MAMTJ6</title>

    <!-- Google Fonts: Inter + Noto Naskh Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        arabic: ['Noto Naskh Arabic', 'serif'],
                    },
                },
            },
        }
    </script>
</head>

<body class="bg-zinc-50 text-zinc-950 font-sans antialiased">
    <div class="min-h-screen flex items-center justify-center p-[24px] sm:p-[72.8px]">
        <div id="display" class="w-full max-w-[1498px]">
            <p class="text-zinc-400 text-center">Memuatkan...</p>
        </div>
    </div>

    <script src="/csr/asma-ul-husna/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const display = document.getElementById('display');

            asmaLoadNames()
                .then(function (result) {
                    const index0 = asmaIndexFromURL(result.todayIndex0);
                    const entry = result.names[index0];
                    if (!entry) throw new Error('Nama tidak ditemui.');

                    const isPreview = index0 !== result.todayIndex0;

                    display.innerHTML =
                        '<div class="flex flex-col lg:flex-row items-center gap-[20px] lg:gap-[104px]">' +
                            '<div class="flex-1 min-w-0 text-center">' +
                                '<span class="inline-block mb-[12px] rounded-full px-[14px] py-[5px] text-[13px] sm:text-[18.2px] font-semibold ' +
                                (isPreview ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700') + '">' +
                                (isPreview ? 'Asma-ul-Husna — Previewing Hari ' + entry.index : 'Asma-ul-Husna Hari Ini:') +
                                '</span>' +
                                '<img src="' + ASMA_SVG_BASE + entry.svg + '" alt="' + entry.latin + '" ' +
                                'class="w-[150px] h-auto sm:w-[374.4px] mx-auto mb-[12px]">' +
                                '<div class="text-[13px] sm:text-[18.2px] text-zinc-400 mb-[4px]">Nama ke-' + entry.index + ' daripada 99</div>' +
                                '<h1 class="text-[28px] sm:text-[62.4px] font-bold text-zinc-900 mb-[6px]">' + entry.latin + '</h1>' +
                                '<p class="text-[17px] sm:text-[31.2px] font-semibold text-emerald-700">' + entry.shortMeaning + '</p>' +
                            '</div>' +
                            '<div class="hidden lg:block w-px self-stretch bg-zinc-200"></div>' +
                            '<div class="flex-1 min-w-0 text-left bg-zinc-100 rounded-[16px] p-[16px] sm:p-[41.6px] lg:p-[62.4px]">' +
                                '<h2 class="text-[20px] sm:text-[39px] lg:text-[57px] font-bold leading-tight text-zinc-900 mb-[12px] sm:mb-[41.6px]">Setiap Hari,<br><span class="lg:whitespace-nowrap">Satu Asma-ul-Husna</span></h2>' +
                                '<div class="text-[14px] sm:text-[23.4px] font-semibold text-zinc-900 mb-[4px] sm:mb-[10.4px]">Maksud:</div>' +
                                '<p class="text-[13px] sm:text-[23.4px] text-zinc-600 leading-relaxed">' + entry.explanation + '</p>' +
                            '</div>' +
                        '</div>';
                })
                .catch(function (err) {
                    display.innerHTML = '<p class="text-red-500 text-center">' + err.message + '</p>';
                });
        });
    </script>
</body>

</html>
