<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuaca Pahang — Paparan Digital</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Anti-flash: apply the saved theme before first paint (default dark
       for a TV kiosk) — same purpose as calendar/hijri's Tailwind version,
       adapted since this page loads no Tailwind. -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
    })();
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- ABSOLUTE paths throughout — the Vercel cleanUrls lesson: relative
       paths resolve one level too high on slash-less directory URLs -->
  <link rel="stylesheet" href="/csr/weather/paparan/style.css" />
</head>

<body>

  <div id="stage">
    <header class="top-bar">
      <div class="title-block">
        <h1>Cuaca Pahang</h1>
        <span class="subtitle">Amaran &amp; Peta Daerah</span>
      </div>
      <div class="top-bar-right">
        <div class="clock-block">
          <span id="live-clock">—</span>
          <span id="live-date">—</span>
        </div>
        <button id="theme-toggle" class="theme-toggle-btn" type="button">—</button>
      </div>
    </header>

    <div id="test-mode-banner"></div>

    <main>
      <div id="map-panel" class="panel">
        <div id="map"></div>
        <div id="map-legend" class="legend-card">
          <div class="legend-title">Status Daerah</div>
          <div class="legend-row"><span class="legend-swatch" data-tier="amaran"></span>Ribut Petir / Hujan Lebat</div>
          <div class="legend-row"><span class="legend-swatch" data-tier="waspada"></span>Waspada</div>
          <div class="legend-row"><span class="legend-swatch" data-tier="buruk"></span>Buruk</div>
          <div class="legend-row"><span class="legend-swatch" data-tier="bahaya"></span>Bahaya</div>
        </div>
      </div>

      <div class="right-col">
        <section class="forecast-card panel" id="forecast-card">
          <div class="forecast-head" id="forecast-head">
            <h2>Temerloh</h2><span>Ramalan Cuaca</span>
            <span class="forecast-warn-badge" id="forecast-warn-badge">
              <span class="tier-swatch"></span><span class="tier-label"></span>
            </span>
          </div>
          <div class="forecast-body">
            <div class="forecast-temp"><span id="forecast-temp">—</span><small>min – maks hari ini</small></div>
            <div class="forecast-slots">
              <div class="forecast-slot">
                <div class="slot-name">Pagi</div>
                <div class="slot-icon" id="slot-icon-pagi">—</div>
                <div class="slot-text" id="slot-text-pagi">—</div>
              </div>
              <div class="forecast-slot">
                <div class="slot-name">Petang</div>
                <div class="slot-icon" id="slot-icon-petang">—</div>
                <div class="slot-text" id="slot-text-petang">—</div>
              </div>
              <div class="forecast-slot">
                <div class="slot-name">Malam</div>
                <div class="slot-icon" id="slot-icon-malam">—</div>
                <div class="slot-text" id="slot-text-malam">—</div>
              </div>
            </div>
          </div>
        </section>

        <section class="warn-card empty panel" id="card-thunder"></section>
        <section class="warn-card empty panel" id="card-rain"></section>
      </div>
    </main>

    <footer id="page-footer">
      <span id="footer-source">Sumber data: MET Malaysia / data.gov.my</span>
      <span id="footer-updated">—</span>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/csr/weather/paparan/weather-core.js"></script>

  <script>
    // =========================================================
    // csr/weather/paparan — signage rendering only.
    // Config, parsing, severity tiers and ?testWarning= fixtures come
    // from ./weather-core.js — this page's own local copy (forked from
    // the interactive page's csr/weather/weather-core.js on 2026-08-10,
    // see that file's header comment for why). Not shared anymore.
    // =========================================================

    // Hardcoded by decision (2026-07-19): this screen serves Temerloh.
    const FORECAST_URL = 'https://api.data.gov.my/weather/forecast?contains=Ds061@location__location_id';
    const FORECAST_REFRESH_MS = 60 * 60 * 1000; // daily-granularity data — hourly is plenty
    const TICK_MS = 60 * 1000;                  // relative-time labels + nightly-reload check

    const TEST_WARNING_PARAM = new URLSearchParams(window.location.search).get('testWarning');

    let map, geojsonLayer;
    let warningDistricts = new Map(); // district name → severity tier
    let warningScope = null;          // null | 'district' | 'state'
    let warningStateTier = null;
    let activeWarnings = [];
    let lastCheckedAt = null;
    let forecastToday = null;         // today's row from the forecast API, once fetched

    // =========================================================
    // Theme toggle — localStorage['theme'] = 'dark'|'light', default dark.
    // <html data-theme> is already set pre-paint by the <head> script;
    // body.map-dark drives the Leaflet dark-tile filter (style.css).
    // =========================================================
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.body.classList.toggle('map-dark', theme === 'dark');
      document.getElementById('theme-toggle').textContent = theme === 'dark' ? 'Mod Terang' : 'Mod Gelap';
    }

    function initThemeToggle() {
      applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        applyTheme(next);
      });
    }

    // =========================================================
    // Live clock + date — folded into the existing TICK_MS loop below.
    // =========================================================
    function renderClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent =
        now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('live-date').textContent =
        now.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    // =========================================================
    // 1920x1080 fixed-canvas signage stage, uniformly scaled to fit
    // whatever screen this loads on (TVs, dev browser windows, etc).
    // =========================================================
    function applyStageScale() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    // =========================================================
    // Map — non-interactive: a TV has no mouse. Warning tiers
    // still paint exactly as on the interactive page.
    // ?debugMap=1 temporarily re-enables drag/zoom so a dev can find the
    // right fitBounds/setView values by hand — remove before shipping.
    // =========================================================
    const DEBUG_MAP = new URLSearchParams(window.location.search).has('debugMap');
    map = L.map('map', {
      zoomControl: DEBUG_MAP,
      dragging: DEBUG_MAP,
      scrollWheelZoom: DEBUG_MAP,
      doubleClickZoom: DEBUG_MAP,
      boxZoom: DEBUG_MAP,
      keyboard: DEBUG_MAP,
      touchZoom: DEBUG_MAP,
      zoomSnap: DEBUG_MAP ? 0.1 : 0, // 0 = no rounding, needed so the fractional zoom below isn't snapped to an integer
      zoomDelta: DEBUG_MAP ? 0.1 : 1,
      wheelPxPerZoomLevel: DEBUG_MAP ? 600 : 60, // slow scroll-wheel down to ~0.1/notch
    }).setView([3.6066, 102.7932], 8.7); // hand-tuned via ?debugMap=1 to frame Pahang

    if (DEBUG_MAP) {
      const readout = document.createElement('div');
      readout.style.cssText = 'position:absolute;z-index:1000;top:8px;left:8px;background:#000c;color:#0f0;font:12px monospace;padding:6px 10px;border-radius:6px;pointer-events:none;';
      document.getElementById('map').appendChild(readout);
      const updateReadout = () => {
        const c = map.getCenter();
        const text = `center: [${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}]  zoom: ${map.getZoom().toFixed(1)}`;
        readout.textContent = text;
        console.log('[debugMap]', text);
      };
      map.on('moveend zoomend', updateReadout);
      map.whenReady(updateReadout);
    }

    // hostname must be {s}.basemaps.cartocdn.com — an extra ".tile." level
    // breaks TLS (wildcard cert covers one subdomain level only).
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    // Redesign wants grey (#8a8a8a) borders on unwarned districts — a
    // paparan-local override so weather-core.js's shared defaultStyle
    // (also used by the interactive page) never gets touched.
    const PAPARAN_DEFAULT_STYLE = { ...defaultStyle, color: '#8a8a8a' };

    // Every district border stays the same grey, same weight, regardless
    // of warning state — only the fill colour changes per tier. A
    // tier-coloured or thicker/black border was tried and didn't read
    // well against the map.
    function baseStyle(feature) {
      const tier = warningDistricts.get(feature.properties.name);
      // District-specific tier paints on top even under a state-wide wash.
      if (tier) return { ...districtWarningStyle(tier), color: '#8a8a8a', weight: 2 };
      if (warningScope === 'state') return { ...stateWarningStyle(warningStateTier), color: '#8a8a8a', weight: 2 };
      return PAPARAN_DEFAULT_STYLE;
    }

    function repaintMap() {
      if (geojsonLayer) geojsonLayer.setStyle(baseStyle);
    }

    function loadGeoJSON() {
      fetchWithTimeout(GEOJSON_URL, 8000)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          const pahangData = {
            type: "FeatureCollection",
            features: data.features.filter(f => f.properties.state === "PHG")
          };
          geojsonLayer = L.geoJSON(pahangData, {
            style: baseStyle,
            onEachFeature: (feature, layer) => {
              layer.bindTooltip(feature.properties.name, {
                permanent: true, direction: 'center', className: 'district-label-pill'
              });
            }
          }).addTo(map);
          refreshWarnings();
        })
        .catch(err => {
          console.warn('[weather] Failed to load district map:', err.message);
          const mapDiv = document.getElementById('map');
          mapDiv.classList.add('map-error');
          mapDiv.textContent = 'Peta tidak dapat dimuatkan.';
        });
    }

    // =========================================================
    // Relative-time labels (re-rendered every minute)
    // =========================================================
    function relPast(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      const mins = Math.floor((Date.now() - d.getTime()) / 60000);
      if (mins < 1) return 'Sebentar tadi';
      if (mins < 60) return `${mins} minit lepas`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? `${h} jam ${m} minit lepas` : `${h} jam lepas`;
    }

    function relFuture(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      const mins = Math.floor((d.getTime() - Date.now()) / 60000);
      if (mins < 0) return 'Tamat tempoh';
      if (mins < 1) return 'Kurang 1 minit lagi';
      if (mins < 60) return `${mins} minit lagi`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? `${h} jam ${m} minit lagi` : `${h} jam lagi`;
    }

    function formatTimeBM(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleString('ms-MY', { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
    }

    // Compact HH:MM (no date) for the redesigned cards' inline
    // "Dikeluarkan"/"sehingga" lines — formatTimeBM (full date) stays
    // defined/used elsewhere, this is purely an additional short form.
    function formatTimeShort(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    // =========================================================
    // Warning cards — two FIXED cards, one per source
    // =========================================================
    function newestFirst(list) {
      return list.slice().sort((a, b) =>
        new Date(b.warning_issue?.issued || 0) - new Date(a.warning_issue?.issued || 0));
    }

    // 'amaran' (thunderstorm/rain-lebat, untiered) reads as "Ribut Petir /
    // Hujan Lebat" in the UI, matching the card title and legend — the
    // raw TIER_LABEL value ("Amaran") is too generic on its own here.
    function tierRowLabel(tier) {
      return tier === 'amaran' ? 'Ribut Petir / Hujan Lebat' : (TIER_LABEL[tier] || tier);
    }

    function renderWarnCard(el, title, items, marineCount) {
      if (!items.length) {
        el.className = 'warn-card empty panel';
        el.style.borderLeftColor = 'transparent';
        el.innerHTML = `
          <div class="warn-card-head"><h2>Tiada ${escapeHtml(title)}</h2></div>
          ${marineCount ? '<div class="warn-marine-note">🌊 Amaran perairan Pahang sahaja aktif (bukan kawasan darat)</div>' : ''}`;
        return;
      }

      const w = items[0];
      const parsed = pahangScopeOf(w);
      // Highest tier among this warning's districts drives the accent colour.
      let accentTier = parsed.tier || 'amaran';
      Object.values(parsed.tiers || {}).forEach(t => {
        if (TIER_RANK[t] > TIER_RANK[accentTier]) accentTier = t;
      });

      // One pill per Pahang district, coloured by its severity tier — the
      // bulletin's full text is deliberately NOT shown: MET publishes one
      // nationwide bulletin listing every state, which is noise on a
      // Pahang-only screen.
      const pill = (label, tier) => {
        const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
        // 'amaran' (Ribut Petir/Hujan Lebat) is MET's dark blue, so it
        // needs white text like buruk/bahaya — only the bright yellow
        // 'waspada' pill still needs dark text.
        const textColor = tier === 'waspada' ? '#713f12' : '#ffffff';
        return `<span class="warn-pill" style="background:${c.fill};color:${textColor}">${escapeHtml(label)}</span>`;
      };

      // Group districts by tier so each severity gets its own row — MET's
      // bulletins only ever carry ONE valid_to per bulletin (verified in
      // weather-core.js's normalizeRainWarnings/parseRainPahang, no
      // per-section expiry exists), so every row below intentionally
      // reuses the same warning-level "sehingga" value — don't invent a
      // per-tier timestamp that the underlying data can't actually give.
      let rowsHtml = '';
      if (parsed.scope !== 'marine') {
        const groups = new Map(); // tier -> [district label, ...]
        if (parsed.scope === 'state') {
          groups.set(accentTier, ['Seluruh Pahang']);
        } else {
          parsed.districts.forEach(d => {
            const t = (parsed.tiers && parsed.tiers[d]) || 'amaran';
            if (!groups.has(t)) groups.set(t, []);
            groups.get(t).push(d);
          });
        }
        const tiersSorted = [...groups.keys()].sort((a, b) => TIER_RANK[b] - TIER_RANK[a]);
        const sehinggaShort = w.valid_to ? (formatTimeShort(w.valid_to) || '—') : '—';
        const sehinggaRel = w.valid_to ? (relFuture(w.valid_to) || '') : '';
        rowsHtml = tiersSorted.map(tier => {
          const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
          const districtsHtml = groups.get(tier).slice().sort((a, b) => a.localeCompare(b))
            .map(d => pill(d, tier)).join('');
          return `
            <div class="warn-card-tier-row">
              <div class="tier-row-head">
                <span class="tier-swatch" style="background:${c.fill}"></span>
                <span class="tier-label">${escapeHtml(tierRowLabel(tier))}</span>
                <span class="tier-sehingga">sehingga ${escapeHtml(sehinggaShort)}${sehinggaRel ? ` · <span class="rel-chip">${escapeHtml(sehinggaRel)}</span>` : ''}</span>
              </div>
              <div class="tier-row-districts">${districtsHtml}</div>
            </div>`;
        }).join('');
      }

      const issued = w.warning_issue?.issued;
      const issuedShort = issued ? (formatTimeShort(issued) || '—') : '—';
      const issuedRel = issued ? (relPast(issued) || '') : '';
      const more = items.length > 1 ? `+${items.length - 1} lagi` : '';

      el.className = 'warn-card active panel' + (accentTier === 'bahaya' ? ' tier-bahaya-active' : '');
      el.style.borderLeftColor = (TIER_COLORS[accentTier] || TIER_COLORS.amaran).fill;
      el.innerHTML = `
        <div class="warn-card-head">
          ${accentTier === 'bahaya' ? '<span class="pulse-dot"></span>' : ''}
          <h2>${escapeHtml(title)}</h2>
          ${more ? `<span class="warn-more">${escapeHtml(more)}</span>` : ''}
          <span class="meta-issued">Dikeluarkan ${escapeHtml(issuedShort)}${issuedRel ? ` · <span class="rel-chip">${escapeHtml(issuedRel)}</span>` : ''}</span>
        </div>
        ${rowsHtml}
        ${(marineCount || parsed.scope === 'marine') ? '<div class="warn-marine-note">🌊 Amaran perairan Pahang aktif (bukan kawasan darat)</div>' : ''}`;
    }

    function renderCards() {
      const rain = newestFirst(activeWarnings.filter(w => w.source === 'rain'));
      const others = newestFirst(activeWarnings.filter(w => w.source !== 'rain'));
      const land = others.filter(w => pahangScopeOf(w).scope !== 'marine');
      const marineCount = others.length - land.length;

      renderWarnCard(document.getElementById('card-thunder'), 'Ribut Petir / Hujan Lebat', land, marineCount);
      renderWarnCard(document.getElementById('card-rain'), 'Amaran Hujan Berterusan', rain, 0);
    }

    function updateFooter() {
      const timeText = lastCheckedAt
        ? lastCheckedAt.toLocaleString('ms-MY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
        : '—';
      document.getElementById('footer-updated').textContent =
        `Dikemaskini ${timeText} · Auto setiap 3 minit`;
    }

    async function refreshWarnings() {
      lastCheckedAt = new Date();

      const fixture = getTestWarningFixture(TEST_WARNING_PARAM);
      if (fixture !== undefined) {
        activeWarnings = fixture.filter(isWarningActive);
        const state = computeWarningState(activeWarnings);
        warningScope = state.scope;
        warningDistricts = state.districts;
        warningStateTier = state.stateTier;
      } else {
        // Two independent sources — either failing alone must not take
        // down the other (rain proxy 404s under local static servers).
        const [thunder, rain] = await Promise.allSettled([
          fetchActiveWarnings(),
          fetchRainWarnings(),
        ]);

        if (thunder.status === 'rejected' && rain.status === 'rejected') {
          console.warn('[weather] Both warning sources failed:', thunder.reason?.message, rain.reason?.message);
          // Keep the previously-known state on screen.
        } else {
          if (thunder.status === 'rejected') console.warn('[weather] data.gov.my warnings failed:', thunder.reason?.message);
          if (rain.status === 'rejected') console.warn('[weather] rain proxy failed (expected under local static server):', rain.reason?.message);
          activeWarnings = [
            ...(thunder.status === 'fulfilled' ? thunder.value : []),
            ...(rain.status === 'fulfilled' ? rain.value : []),
          ];
          const state = computeWarningState(activeWarnings);
          warningScope = state.scope;
          warningDistricts = state.districts;
          warningStateTier = state.stateTier;
        }
      }

      repaintMap();
      renderCards();
      applyForecastWarningAccent();
      updateFooter();
    }

    // =========================================================
    // Forecast (daily granularity — Pagi/Petang/Malam + min–maks)
    // =========================================================
    function localDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Finite set of Malay phrases from the API → icon. Unmapped phrases
    // warn instead of silently showing the wrong sky (same philosophy as
    // resolveDistrictName in weather-core.js).
    function forecastIcon(phrase, slot) {
      const p = (phrase || '').toLowerCase();
      if (!p) return '—';
      if (p.includes('ribut petir')) return '⛈️';
      if (p.includes('tiada hujan')) return slot === 'malam' ? '🌙' : '☀️';
      if (p.includes('hujan')) return (p.includes('beberapa') || p.includes('satu dua')) ? '🌦️' : '🌧️';
      if (p.includes('jerebu')) return '🌫️';
      if (p.includes('berangin')) return '💨';
      if (p.includes('berawan') || p.includes('mendung')) return '☁️';
      console.warn('[weather] Unmapped forecast phrase:', phrase);
      return '🌤️';
    }

    // Forecast-card warning accent — mirrors baseStyle()'s two-step lookup
    // (explicit district tier, else state-wide fallback) for the single
    // hardcoded district 'Temerloh'. Reads only current globals, so it's
    // safe to call from BOTH renderForecast() (hourly) and refreshWarnings()
    // (3-min) — whichever fires last just repaints the same current truth,
    // no staleness window between the two independent refresh intervals.
    // Soft alpha wash of a tier's fill colour, e.g. '#fa0101' -> 'rgba(250,1,1,0.18)'
    // — strong enough to catch the eye without needing per-tier text-colour
    // switching (existing --text colour still reads fine over it).
    function tierWash(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyForecastWarningAccent() {
      const tier = warningDistricts.get('Temerloh') ||
        (warningScope === 'state' ? warningStateTier : null);

      const head = document.getElementById('forecast-head');
      const badge = document.getElementById('forecast-warn-badge');

      if (tier) {
        const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
        head.style.borderColor = c.fill;
        head.style.backgroundColor = tierWash(c.fill, 0.18);
        badge.querySelector('.tier-swatch').style.background = c.fill;
        badge.querySelector('.tier-label').textContent = tierRowLabel(tier);
        badge.classList.add('active');
      } else {
        head.style.borderColor = 'transparent';
        head.style.backgroundColor = 'transparent';
        badge.classList.remove('active');
      }
    }

    function renderForecast() {
      applyForecastWarningAccent();
      if (!forecastToday) return; // keep "—" placeholders until first success
      const f = forecastToday;
      document.getElementById('forecast-temp').textContent =
        (f.min_temp != null && f.max_temp != null) ? `${f.min_temp}° – ${f.max_temp}°` : '—';
      [['pagi', f.morning_forecast], ['petang', f.afternoon_forecast], ['malam', f.night_forecast]]
        .forEach(([slot, phrase]) => {
          document.getElementById(`slot-icon-${slot}`).textContent = forecastIcon(phrase, slot);
          document.getElementById(`slot-text-${slot}`).textContent = phrase || '—';
        });
    }

    async function refreshForecast() {
      try {
        const resp = await fetchWithTimeout(FORECAST_URL, 8000);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const rows = await resp.json();
        // API sorts date-DESCENDING — limit= would return the FURTHEST
        // days, so we fetch all and pick today explicitly (verified live).
        const today = localDateStr(new Date());
        const row = (Array.isArray(rows) ? rows : []).find(r => r.date === today);
        if (row) forecastToday = row;
        renderForecast();
      } catch (e) {
        // Keep last-known forecast on screen; placeholders only before
        // the first-ever success.
        console.warn('[weather] Forecast fetch failed:', e.message);
      }
    }

    // =========================================================
    // Boot + loops
    // =========================================================
    if (TEST_WARNING_PARAM) {
      const el = document.getElementById('test-mode-banner');
      el.classList.add('active');
      el.textContent = `🧪 MOD UJIAN AKTIF — testWarning=${TEST_WARNING_PARAM} (data ujian, bukan amaran sebenar)`;
    }

    initThemeToggle();
    renderClock();
    applyStageScale();
    window.addEventListener('load', applyStageScale);
    window.addEventListener('resize', applyStageScale);

    loadGeoJSON();
    refreshForecast();
    renderCards(); // paint both empty states immediately, before first fetch

    if (!TEST_WARNING_PARAM) {
      setInterval(() => { if (geojsonLayer) refreshWarnings(); }, REFRESH_MS);
    }
    setInterval(refreshForecast, FORECAST_REFRESH_MS);

    // Minute tick: keep "X minit lepas / lagi" honest, refresh the clock,
    // and reload nightly at ~04:00 (kiosk hygiene — clears leaked memory
    // and picks up deploys).
    setInterval(() => {
      renderCards();
      renderClock();
      const now = new Date();
      if (now.getHours() === 4 && now.getMinutes() === 0) location.reload();
    }, TICK_MS);
  </script>

</body>

</html>
